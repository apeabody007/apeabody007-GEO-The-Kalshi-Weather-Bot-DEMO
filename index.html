// Refresh-watch-list handler. Wired to the ↻ Refresh button next to
// the "Watch List" title. POSTs to /api/refresh_watch_list
// which spawns dashboard/_refresh_watch_list.py — a ~60s scan that
// rewrites .watch_list_cache.json. We then poll /api/watch_list_meta
// every 3 seconds and reload the page once the cache mtime moves
// (= scan finished writing). Hard timeout at 180s to avoid infinite
// polling if the scan crashes.
async function refreshWatchList(btn) {
  const status = document.getElementById("wlRefreshStatus");
  const setStatus = (msg, kind) => {
    if (!status) return;
    status.className = "wl-refresh-status" + (kind ? " " + kind : "");
    status.textContent = msg;
  };

  // Capture the baseline mtime BEFORE kicking off the scan so we can
  // tell unambiguously when a new cache file appears. Done before the
  // POST so a network blip doesn't lose the baseline.
  let baselineMtime = null;
  try {
    const m = await fetch("/api/watch_list_meta", {cache: "no-store"}).then(r => r.json());
    baselineMtime = m.mtime || 0;
  } catch (e) {
    baselineMtime = 0;
  }

  btn.disabled = true;
  btn.textContent = "↻ Scanning…";
  setStatus("Posting refresh request…");

  // Kick off the scan
  let postOk = false;
  try {
    const resp = await fetch("/api/refresh_watch_list", {method: "POST"});
    const data = await resp.json().catch(() => ({}));
    if (resp.status === 202 && data.ok) {
      postOk = true;
      setStatus("Scanning markets — ~60s…");
    } else if (resp.status === 409) {
      setStatus("✗ " + (data.error || "Already running"), "error");
      btn.disabled = false;
      btn.textContent = "↻ Refresh";
      return;
    } else {
      setStatus("✗ " + (data.error || ("HTTP " + resp.status)), "error");
      btn.disabled = false;
      btn.textContent = "↻ Refresh";
      return;
    }
  } catch (e) {
    setStatus("✗ network error: " + (e && e.message ? e.message : e), "error");
    btn.disabled = false;
    btn.textContent = "↻ Refresh";
    return;
  }
  if (!postOk) return;

  // Poll the meta endpoint until the cache mtime moves OR we time out.
  const pollIntervalMs = 3000;
  const timeoutMs = 180000; // 3 min — generous; scans normally take ~60s
  const startedAt = Date.now();
  const tick = async () => {
    const elapsedSec = Math.round((Date.now() - startedAt) / 1000);
    try {
      const m = await fetch("/api/watch_list_meta", {cache: "no-store"}).then(r => r.json());
      if (m.ok && m.mtime && m.mtime !== baselineMtime) {
        // New cache written — reload the dashboard so the user sees the
        // fresh candidates. The dashboard server re-renders on every
        // GET, so a vanilla reload picks up the change.
        setStatus("✓ Scan complete — reloading…", "ok");
        // Tiny delay so the user actually sees the success message.
        setTimeout(() => window.location.reload(), 400);
        return;
      }
      const inFlight = m && m.refresh_in_flight;
      if (!inFlight && elapsedSec > 5) {
        // Scan exited (PID gone) but mtime didn't move. That means the
        // refresh script crashed before writing the cache. Surface this
        // instead of polling forever.
        setStatus("✗ Scan exited without writing cache. Check log.", "error");
        btn.disabled = false;
        btn.textContent = "↻ Refresh";
        return;
      }
      setStatus("Scanning markets — " + elapsedSec + "s elapsed…");
    } catch (e) {
      // Transient — keep polling unless we've blown the timeout.
    }
    if (Date.now() - startedAt > timeoutMs) {
      setStatus("⚠ Refresh timed out (180s). The scan may still be running — try reloading manually.", "error");
      btn.disabled = false;
      btn.textContent = "↻ Refresh";
      return;
    }
    setTimeout(tick, pollIntervalMs);
  };
  setTimeout(tick, pollIntervalMs);
}

// Background fill-marker poller. Runs continuously while the dashboard
// is open. main.py's _watch_and_requote touches dashboard/.last_fill.marker
// the moment a bot-placed maker order disappears from open_orders
// (= filled or cancelled externally on Kalshi's side). We capture the
// marker mtime at page load, poll /api/fill_meta every 10s while the
// tab is visible, and call location.reload() when the mtime moves so
// the user sees their new fill on the dashboard automatically — no
// manual refresh after a Telegram approval.
//
// Pauses on visibilitychange→hidden to avoid wasted work and resumes
// on visible. Independent of the watch_list refresh poller; they don't
// share state.
(function startFillMarkerPoller() {
  let baselineMtime = null;
  let timer = null;
  const POLL_MS = 10000;

  async function captureBaseline() {
    try {
      const r = await fetch("/api/fill_meta", {cache: "no-store"});
      const j = await r.json();
      if (j && j.ok) baselineMtime = j.mtime || 0;
    } catch (e) {
      baselineMtime = 0; // Treat network error as "no baseline yet"; next tick will retry.
    }
  }

  async function tick() {
    if (document.visibilityState !== "visible") return;
    try {
      const r = await fetch("/api/fill_meta", {cache: "no-store"});
      const j = await r.json();
      if (!j || !j.ok) return;
      // First successful response after a missing-baseline state — adopt it.
      if (baselineMtime === null || baselineMtime === 0) {
        baselineMtime = j.mtime || 0;
        return;
      }
      if (j.mtime && j.mtime !== baselineMtime) {
        // A fill landed on Kalshi since we last loaded the page. Reload
        // so the positions / P&L / watch-list panels reflect the new
        // state. The dashboard server re-renders on every GET, so a
        // vanilla reload pulls fresh data.
        window.location.reload();
      }
    } catch (e) {
      // Transient — try again next tick.
    }
  }

  function start() {
    if (timer !== null) return;
    timer = setInterval(tick, POLL_MS);
  }
  function stop() {
    if (timer === null) return;
    clearInterval(timer);
    timer = null;
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") start();
    else stop();
  });

  captureBaseline().then(() => {
    if (document.visibilityState === "visible") start();
  });
})();

// Click-to-trade handler. Wired to every "would trade →" button in the
// Watch List card. Posts to the dashboard server's
// /api/execute_trade endpoint, which spawns `main.py --execute-ticker`
// and returns 202 once the subprocess is launched. The actual trade
// approval still happens via Telegram on the user's phone — this just
// kicks off the bot run that will send that Telegram.
async function executeTrade(btn) {
  const ticker = btn.dataset.ticker;
  const side = (btn.dataset.side || "").toLowerCase();
  const ourPct = btn.dataset.ourProb;
  const mktPct = btn.dataset.marketProb;
  const sideUpper = side.toUpperCase();
  // Confirmation dialog with the same numbers shown in the row, so the
  // user has one last chance to verify the row they meant to click is
  // the row that's about to fire.
  const ok = window.confirm(
    "Click-to-trade: " + ticker + "\n\n" +
    "Buy " + sideUpper + "  |  Our P: " + ourPct + "%  |  Market P: " + mktPct + "%\n\n" +
    "This launches a fresh scan for THIS ticker. If it still passes the bot's " +
    "filters, Telegram will ask for approval before any order is placed. " +
    "If it no longer qualifies, you'll get a Telegram explaining why.\n\n" +
    "Proceed?"
  );
  if (!ok) return;

  // Reach the status span we left in the cell. Multiple rows may share a
  // ticker (different sides), so we scope by the row's tbody position.
  const status = btn.parentElement.querySelector(
    `.trade-status[data-ticker="${ticker.replace(/"/g, '\\"')}"]`
  );
  btn.disabled = true;
  btn.textContent = "queuing…";
  if (status) {
    status.className = "trade-status";
    status.textContent = "Sending to bot…";
  }

  try {
    const resp = await fetch("/api/execute_trade", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ticker: ticker, side: side}),
    });
    const data = await resp.json().catch(() => ({}));
    if (resp.status === 202 && data.ok) {
      btn.textContent = "queued ✓";
      if (status) {
        status.className = "trade-status ok";
        status.textContent = "Queued. Watch Telegram (~60s).";
      }
      // Leave the button disabled; if the user wants to retry they can
      // refresh the dashboard. Re-enabling would invite a double-click
      // → two scans → two Telegram alerts for the same ticker, which
      // is exactly the kind of stomp-on-each-other problem the
      // single-instance lock was added to prevent.
    } else {
      const errMsg = data.error || ("HTTP " + resp.status);
      btn.disabled = false;
      btn.textContent = "would trade →";
      if (status) {
        status.className = "trade-status error";
        status.textContent = "✗ " + errMsg;
      } else {
        window.alert("Click-to-trade failed: " + errMsg);
      }
    }
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "would trade →";
    if (status) {
      status.className = "trade-status error";
      status.textContent = "✗ network error: " + (e && e.message ? e.message : e);
    }
  }
}
const ageString = (iso) => {
  if (!iso) return "no snapshot";
  const t = new Date(iso).getTime();
  if (Number.isNaN(t)) return "no snapshot";
  const diffMin = Math.floor((Date.now() - t) / 60000);
  if (diffMin < 1) return "just now";
  if (diffMin < 60) return diffMin + " min ago";
  const h = Math.floor(diffMin / 60);
  if (h < 24) return h + "h " + (diffMin % 60) + "m ago";
  return Math.floor(h / 24) + "d " + (h % 24) + "h ago";
};

// P&L chart tooltip handlers. Inline on each <circle> so we don't need to
// re-bind on every render. The tooltip lives inside the chart card with
// position:absolute, and we compute its placement from the dot's
// getBoundingClientRect (the SVG's responsive scaling means we can't use
// the SVG's own coordinate system for tooltip placement).
function showPnlTip(circle) {
  const tip = document.getElementById("chart-tip");
  if (!tip) return;
  const date = circle.dataset.date || "";
  const trades = parseInt(circle.dataset.trades || "1", 10);
  const wins = parseInt(circle.dataset.wins || "0", 10);
  const pnl = parseFloat(circle.dataset.pnl);
  const cum = parseFloat(circle.dataset.cum);
  // "2026-04-30" → "Apr 30, 2026" — friendlier read than the raw ISO date.
  const friendlyDate = (() => {
    const d = new Date(date + "T12:00:00Z");
    if (Number.isNaN(d.getTime())) return date;
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
  })();
  const pnlCls = pnl >= 0 ? "tip-pos" : "tip-neg";
  const cumCls = cum >= 0 ? "tip-pos" : "tip-neg";
  const sign = (n) => (n >= 0 ? "+" : "-") + "$" + Math.abs(n).toFixed(2);
  // Daily win rate — color-coded against 50% so the eye finds bad days fast.
  // 0/0 days never get rendered (we only emit a dot when n_trades > 0), but
  // the guard keeps NaN out of the DOM if the data shape ever shifts. The
  // "(wins/trades)" suffix carries the daily trade count, so the previous
  // standalone "N trades" line was dropped to avoid the redundancy.
  const wr = trades > 0 ? (wins / trades) * 100 : 0;
  const wrCls = wr >= 50 ? "tip-pos" : "tip-neg";
  tip.innerHTML = `
    <div class="tip-date">${escapeHtml(friendlyDate)}</div>
    <div class="tip-row">Win rate: <span class="${wrCls}">${wr.toFixed(0)}%</span> <span class="muted">(${wins}/${trades})</span></div>
    <div class="tip-row">Day P&amp;L: <span class="${pnlCls}">${sign(pnl)}</span></div>
    <div>Cumulative: <span class="${cumCls}">${sign(cum)}</span></div>
  `;
  // Position the tip above the dot, in card-relative coordinates.
  const card = circle.closest(".card");
  if (!card) return;
  const dotRect = circle.getBoundingClientRect();
  const cardRect = card.getBoundingClientRect();
  tip.style.left = (dotRect.left - cardRect.left + dotRect.width / 2) + "px";
  tip.style.top  = (dotRect.top  - cardRect.top) + "px";
  tip.classList.add("visible");
}
function hidePnlTip() {
  const tip = document.getElementById("chart-tip");
  if (tip) tip.classList.remove("visible");
}

// Calibration plot hover tooltip — same pattern as showPnlTip but reads
// the bucket's predicted/observed/N fields and labels them so the user
// learns the chart's vocabulary by hovering.
function showCalTip(circle) {
  const tip = document.getElementById("cal-tip");
  if (!tip) return;
  const pred = parseFloat(circle.dataset.pred);
  const obs = parseFloat(circle.dataset.obs);
  const n = parseInt(circle.dataset.n, 10);
  const won = parseInt(circle.dataset.won, 10);
  const range = circle.dataset.range || "";
  const gap = obs - pred;
  const gapCls = Math.abs(gap) < 0.02 ? "" : (gap >= 0 ? "tip-pos" : "tip-neg");
  const gapStr = (gap >= 0 ? "+" : "") + (gap * 100).toFixed(1) + " pp";
  tip.innerHTML = `
    <div class="tip-date">${escapeHtml(range)}% bucket</div>
    <div class="tip-ticker">${n} trade${n === 1 ? "" : "s"} &middot; ${won} won</div>
    <div class="tip-row">Predicted: <span style="font-family: monospace;">${(pred * 100).toFixed(1)}%</span></div>
    <div>Observed: <span style="font-family: monospace;">${(obs * 100).toFixed(1)}%</span> <span class="${gapCls}">(${gapStr})</span></div>
  `;
  const card = circle.closest(".card");
  if (!card) return;
  const dotRect = circle.getBoundingClientRect();
  const cardRect = card.getBoundingClientRect();
  tip.style.left = (dotRect.left - cardRect.left + dotRect.width / 2) + "px";
  tip.style.top = (dotRect.top - cardRect.top) + "px";
  tip.classList.add("visible");
}
function hideCalTip() {
  const tip = document.getElementById("cal-tip");
  if (tip) tip.classList.remove("visible");
}

function renderAbout(data) {
  return (data && data.about_html) ? data.about_html : "";
}

function renderBalance(data) {
  // Both numbers come from a single Kalshi /balance call:
  //   balance_usd   = cash sitting in the wallet
  //   portfolio_usd = value of open positions at current market mids
  //                   (Kalshi's API calls THIS "portfolio_value", but
  //                   Kalshi's UI uses "Portfolio" to mean cash + positions
  //                   — i.e. the all-in account total. We mirror the UI here
  //                   so the right-hand number matches what Aaron sees on
  //                   kalshi.com without mental math.)
  // n_positions       = weather (KXHIGH) positions only — bot scope
  // n_positions_total = all positions, so a manual non-weather play doesn't
  //                     vanish from the count
  const k = data.kalshi || {};
  const cash = k.balance_usd ?? null;
  const positionValue = k.portfolio_usd ?? null;
  const portfolioTotal = (cash != null && positionValue != null) ? cash + positionValue : null;
  // Weather-bot dashboard scope: count and surface only the weather (KXHIGH)
  // positions. Manual non-weather bets (e.g. KXMUSKOAI) still affect the
  // portfolio total via Kalshi's portfolio_value field, but they don't
  // belong in this card's count line — that's about what THE BOT is doing.
  const nWx = k.n_positions ?? 0;
  const positionLine = nWx === 0
    ? "No open weather positions"
    : `${nWx} open weather &middot; ${fmtUSD(positionValue)} in positions`;
  const error = !k.ok ? `<div class="sub-stat neg">⚠ ${escapeHtml(k.error || "")}</div>` : "";
  return `
    <div class="card">
      <div class="card-title">Account balance</div>
      <div class="kpi-row">
        <div>
          <div class="big-number neutral" data-num-key="cash" data-num-value="${cash ?? ''}">${fmtUSD(cash)}</div>
          <div class="sub-stat">Cash balance</div>
        </div>
        <div>
          <div class="big-number neutral" data-num-key="portfolio" data-num-value="${portfolioTotal ?? ''}">${fmtUSD(portfolioTotal)}</div>
          <div class="sub-stat">Portfolio total <span class="muted">(cash + positions)</span></div>
        </div>
      </div>
      <div class="sub-stat" style="margin-top: 8px;">${positionLine}</div>
      ${error}
    </div>`;
}

function renderPnL(data) {
  const p = data.pnl || {};
  const all = p.realized_all ?? 0, _24h = p.realized_24h ?? 0, _7d = p.realized_7d ?? 0;
  const won = p.n_won ?? 0, lost = p.n_lost ?? 0;
  const winRate = p.win_rate != null ? `${(p.win_rate * 100).toFixed(0)}%` : "—";
  // W/L pill — green wins, red losses, neutral win-rate. Reads "5W / 9L · 36% win rate".
  const wlLine = (won + lost) === 0
    ? `<div class="sub-stat">No settled trades yet.</div>`
    : `<div class="sub-stat"><span class="pos" style="font-weight: 600;">${won}W</span> / <span class="neg" style="font-weight: 600;">${lost}L</span> · ${winRate} win rate</div>`;
  return `
    <div class="card">
      <div class="card-title">Profits &amp; Losses</div>
      <div class="big-number ${pnlClass(all)}" data-num-key="pnl_all" data-num-value="${all ?? ''}">${fmtUSD(all, true)}</div>
      ${wlLine}
      <div class="sub-stat">Last 24h: <span class="${pnlClass(_24h)}">${fmtUSD(_24h, true)}</span> · 7d: <span class="${pnlClass(_7d)}">${fmtUSD(_7d, true)}</span></div>
      <div class="sub-stat">${p.n_settled ?? 0} settled · ${p.n_trades ?? 0} total · open cost ${fmtUSD(p.open_cost_usd)}</div>
    </div>`;
}

function renderKPI(data) {
  const k = data.kpi || {};
  const n = k.n_settled ?? 0;
  const sampleTip = "Sample size — number of settled trades feeding these KPIs. Below 30 the headline numbers are dominated by statistical noise (a single $5 win/loss can swing ROI by several points), so KPIs are flagged 'preliminary' until N≥30 when Wilson-style CIs tighten enough to support decisions like cap raises.";
  const sampleWarn = n < 30
    ? `<div class="sub-stat"><span class="pill pill-warn" style="cursor: help;" title="${escapeHtml(sampleTip)}">N=${n} — preliminary</span></div>`
    : `<div class="sub-stat"><span class="pill pill-good" style="cursor: help;" title="${escapeHtml(sampleTip)}">N=${n} — usable</span></div>`;
  const ratio = k.edge_realization_ratio ?? null;

  // Per-family breakdown table (B-buckets vs T-tails). Only rendered if
  // we have at least one settled bucket OR tail trade — pre-launch this
  // collapses to nothing instead of an empty table. Edge realization is
  // the headline metric per family because it's the single most diagnostic
  // number for whether the bot's edge claim is actually being captured.
  const fam = k.by_family || {};
  const famOrder = ["bucket", "tail", "unknown"];
  const famLabel = { bucket: "B-buckets", tail: "T-tails", unknown: "Other" };
  const famRows = famOrder
    .filter(key => fam[key] && fam[key].n > 0)
    .map(key => {
      const f = fam[key];
      const r = f.edge_realization_ratio;
      const roiCell = f.roi != null ? `<span class="${pnlClass(f.roi)}">${fmtPct(f.roi)}</span>` : '<span class="muted">—</span>';
      const ratioCell = r != null ? `<span class="${pnlClass(r)}">${r.toFixed(2)}</span>` : '<span class="muted">—</span>';
      const pnlCell = `<span class="${pnlClass(f.realized_pnl)}">${fmtUSD(f.realized_pnl, true)}</span>`;
      return `<tr>
        <td>${famLabel[key]}</td>
        <td class="numeric muted">${f.n}</td>
        <td class="numeric mono">${roiCell}</td>
        <td class="numeric mono">${f.brier ?? "—"}</td>
        <td class="numeric mono">${ratioCell}</td>
        <td class="numeric mono">${pnlCell}</td>
      </tr>`;
    }).join("");
  // Per-family breakdown is dropped in demo mode — the B-bucket-vs-T-tail
  // split is a GEO-specific tracking choice and the Edge-realization-by-
  // family numbers are direct intel on which subset of markets the bot
  // is profitable in.
  const breakdown = (data.demo_mode || !famRows)
    ? ""
    : `<table style="margin-top: 12px; font-size: 11px;">
         <thead><tr>
           <th>Family</th>
           <th class="numeric">N</th>
           <th class="numeric">ROI</th>
           <th class="numeric">Brier</th>
           <th class="numeric">Edge real.</th>
           <th class="numeric">P&amp;L</th>
         </tr></thead>
         <tbody>${famRows}</tbody>
       </table>
       <div class="help">B-buckets = 1°-wide windows (e.g. B62.5 = 62–63°F). T-tails = cold/hot tail markets (e.g. T54 = high &lt; 54°F). Watch each family's contribution to overall performance.</div>`;

  return `
    <div class="card">
      <div class="card-title">KPI snapshot</div>
      <div class="kpi-row">
        <div><div class="big-number ${pnlClass(k.roi)}" style="font-size: 18px;">${k.roi != null ? fmtPct(k.roi) : "—"}</div><div class="sub-stat">ROI</div></div>
        <div title="${escapeHtml("Brier score — average squared error of the bot's predicted probability vs the actual outcome. For each settled trade, take (p_model − outcome)², where outcome=1 if the contract resolved YES else 0; the Brier score is the mean across all settled trades. Lower is better: 0.00 = perfect, 0.25 = coin-flip baseline, 1.00 = consistently confident and wrong. A proper score, so a model can't game it without genuinely improving.")}" style="cursor: help;"><div class="big-number neutral" style="font-size: 18px;">${n === 0 ? "—" : (k.brier ?? "—")}</div><div class="sub-stat">Brier (0.25=coin)</div></div>
        <div><div class="big-number ${pnlClass(ratio)}" style="font-size: 18px;">${ratio == null ? "—" : ratio.toFixed(2)}</div><div class="sub-stat">Edge realization</div></div>
      </div>
      ${sampleWarn}
      ${breakdown}
    </div>`;
}

function renderPositions(data) {
  // Enriched per-position data is on data.open_trades; live counts are on data.kalshi.positions.
  // Cross-index by ticker for the unified card.
  const liveByTicker = {};
  for (const p of ((data.kalshi || {}).positions || [])) liveByTicker[p.ticker] = p;
  const trades = data.open_trades || [];
  if (trades.length === 0) {
    // Friendlier empty state — when the bot is in cash, surface the watch
    // list count so the user knows the bot is still actively scanning.
    const wlCount = ((data.watch_list || {}).candidates || []).length;
    const wlNote = wlCount > 0
      ? ` Watching ${wlCount} possible trade${wlCount === 1 ? "" : "s"} in the Watch List above.`
      : ` No candidates currently passing the bot's filters.`;
    return `<div class="card"><div class="card-title">Open Trades (live)</div><div class="empty">Bot is in cash.${wlNote}</div></div>`;
  }

  const verdictPill = (v, detail) => {
    const label = { agree: "✓ Agree", disagree: "⚠ Disagree", split: "≈ Split", unknown: "—" }[v] || "—";
    const titleAttr = detail ? ` title="${escapeHtml(detail)}"` : "";
    return `<span class="pill pill-${v || "unknown"}"${titleAttr}>${label}</span>`;
  };

  // Format a UTC ISO timestamp ("2026-05-05T14:23:45+00:00") into a compact
  // local-time stamp like "May 5, 2:23 PM". Falls back to "—" if missing.
  // For multi-fill positions, prefer the earliest fill ts (when the bet was
  // first placed); the data layer surfaces this as `first_fill_ts`.
  const fmtPlacedTs = (iso) => {
    if (!iso) return `<span class="muted">—</span>`;
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return `<span class="muted">${escapeHtml(iso)}</span>`;
    const dateStr = d.toLocaleDateString([], { month: "numeric", day: "numeric" });
    const timeStr = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    return `<span class="muted" style="font-size: 11px;">${escapeHtml(dateStr)}, ${escapeHtml(timeStr)}</span>`;
  };

  // Aggregate totals
  const totalCost = trades.reduce((s, t) => s + (t.cost_usd || 0), 0);
  const totalMTM = trades.reduce((s, t) => s + (t.mtm_value_usd || 0), 0);
  const totalUnrealized = trades.reduce((s, t) => s + (t.unrealized_pnl_usd || 0), 0);

  const rows = trades.map(t => {
    const live = liveByTicker[t.ticker] || {};
    const sideCls = t.side === "yes" ? "pos" : "neg";
    const v = (t.mos_verdict || {}).verdict || "unknown";
    // Forecast detail moved off-cell into a hover tooltip on the pill so the
    // table reads cleaner. Hover the Forecast verdict pill to see the underlying
    // model maxes.
    const mosDetailTip = (t.mos_gfs_max != null || t.mos_nam_max != null)
      ? ""
      : "";
    const settlement = (t.settlement || {}).label || "—";
    // For multi-fill positions, "Placed" shows the earliest fill ts so the
    // user sees when the position was first opened, not when it was last
    // added to. The ×N indicator on the entry-price cell already flags
    // multi-fill aggregation if they want the gory detail.
    const placedTs = t.first_fill_ts || t.ts;
    const mid = t.current_yes_mid;
    // Win % = market-implied probability your position pays out — the
    // same number Kalshi shows on each open bet in its positions page.
    // For YES bets it equals the YES mid; for NO bets it's (1 - YES mid).
    // This is what Aaron originally asked for ("the percentage chance for
    // each bet that it will win"). Color: green when winning, red when not.
    const winProb = mid != null ? (t.side === "yes" ? mid : (1 - mid)) : null;
    // Build the side-aware market-implied win-prob trajectory for the
    // tooltip. Mirrors the Watch List's Win % tooltip pattern: same data
    // source (.watch_list_history.jsonl, attached in enrich_open_positions)
    // and same buildHistoryTooltip helper. We map market_prob (not our_prob)
    // because this cell shows the market-implied win prob — the tooltip
    // should track the *cell value* over time, not the model's confidence.
    // For NO bets, win prob = 1 - market_prob; for YES, = market_prob.
    const historyRaw = Array.isArray(t.history) ? t.history : [];
    const winTitle = historyRaw.length === 0
      ? "No prior scans recorded for this ticker"
      : buildHistoryTooltip(
          `Win % over time (${historyRaw.length} scan${historyRaw.length === 1 ? "" : "s"}, market-implied):`,
          historyRaw,
          r => r.market_prob == null ? null : (t.side === "yes" ? r.market_prob : (1 - r.market_prob)),
          v => v == null ? "—" : `${(v * 100).toFixed(0)}%`,
        );
    const winTitleAttr = ` title="${escapeHtml(winTitle)}" style="cursor: help;"`;
    const winCell = winProb != null
      ? `<td class="numeric mono ${winProb >= 0.5 ? 'pos' : 'neg'}"${winTitleAttr}>${(winProb * 100).toFixed(0)}%</td>`
      : `<td class="muted"${winTitleAttr}>—</td>`;
    const mtmCell = t.unrealized_pnl_usd != null
      ? `<td class="numeric ${pnlClass(t.unrealized_pnl_usd)}">${fmtUSD(t.unrealized_pnl_usd, true)}</td>`
      : `<td class="muted">—</td>`;
    const bucketDesc = t.bracket_description || "";
    return `<tr>
      <td class="mono">${escapeHtml(t.ticker)}</td>
      <td><span class="muted" style="font-size: 11px;">${escapeHtml(bucketDesc)}</span></td>
      <td>${fmtPlacedTs(placedTs)}</td>
      <td><span class="muted" style="font-size: 11px;">${escapeHtml(settlement)}</span></td>
      <td class="${sideCls}">${escapeHtml(String(t.side || "").toUpperCase())} ${t.n_contracts}</td>
      <td class="numeric muted">@${t.price_cents}¢${t._n_fills > 1 ? ` <span style="font-size: 9px;">avg ×${t._n_fills}</span>` : ""}</td>
      <td class="numeric">${fmtUSD(t.cost_usd)}</td>
      ${winCell}
      ${mtmCell}
      <td>${verdictPill(v, mosDetailTip)}</td>
    </tr>`;
  }).join("");

  return `
    <div class="card" style="grid-column: span 2;">
      <div class="card-title">Open Trades (${trades.length})</div>
      <div class="scrollable">
        <table class="positions-table">
          <thead><tr>
            <th>Ticker</th>
            <th>Bucket</th>
            <th>Placed</th>
            <th>Settles</th>
            <th>Side × Qty</th>
            <th class="numeric">Entry</th>
            <th class="numeric">Cost</th>
            <th class="numeric">Win %</th>
            <th class="numeric">P&amp;L</th>
            <th>Forecast verdict</th>
          </tr></thead>
          <tbody>${rows}</tbody>
          <tfoot>
            <tr style="font-weight: 600;">
              <td colspan="6" style="text-align: right; padding-top: 8px; border-top: 2px solid #e3e3e3;">Totals:</td>
              <td class="numeric" style="padding-top: 8px; border-top: 2px solid #e3e3e3;">${fmtUSD(totalCost)}</td>
              <td style="padding-top: 8px; border-top: 2px solid #e3e3e3;"></td>
              <td class="numeric ${pnlClass(totalUnrealized)}" style="padding-top: 8px; border-top: 2px solid #e3e3e3;">${fmtUSD(totalUnrealized, true)}</td>
              <td style="padding-top: 8px; border-top: 2px solid #e3e3e3;"></td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div class="help">Win % = market-implied probability your position pays out — the same number Kalshi shows on each open bet (for NO bets it's the inverse of the YES bucket price). P&amp;L = what we'd make or lose if we sold each position right now at the current Kalshi mid (i.e. unrealized — these positions haven't settled yet). Verdict comes from a secondary forecast source.${data.n_phantom_open_trades > 0 ? ` <span class="muted">${data.n_phantom_open_trades} DB row${data.n_phantom_open_trades === 1 ? "" : "s"} marked open but not held on Kalshi were filtered (likely cancelled fills — DB drift to investigate).</span>` : ""}</div>
    </div>`;
}

// Multi-row tooltip for a Watch List history series. Renders as plain text
// in the HTML title attribute — newlines come through as line breaks in
// native browser tooltips. `format(value)` formats each historical sample.
// `tsFormat(ts)` shortens timestamps to HH:MM (UTC) or "MMM D" if older
// than today; native tooltip = no styling, so legibility comes from spacing.
const buildHistoryTooltip = (header, history, valueFn, formatFn) => {
  if (!history || history.length === 0) return "No prior scans recorded yet";
  // Newest first — matches how the user reads dashboards. Show up to 12
  // entries; older samples are summarized in a trailing line.
  const lines = [header];
  const reversed = history.slice().reverse();
  const cap = Math.min(reversed.length, 12);
  // Display timestamps in Eastern time — that's the user's local trading
  // frame and matches how Kalshi documents settlement windows. History rows
  // are persisted as ISO UTC ("...T01:40:00+00:00") in the cache file.
  const tz = "America/New_York";
  // 12-hour clock with AM/PM — matches how the user reads times in chat.
  const fmtTime = new Intl.DateTimeFormat("en-US", {
    timeZone: tz, hour: "numeric", minute: "2-digit", hour12: true,
  });
  // en-CA gives "YYYY-MM-DD" — convenient for the today-vs-older comparison.
  const fmtDate = new Intl.DateTimeFormat("en-CA", {
    timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit",
  });
  const todayET = fmtDate.format(new Date());
  for (let i = 0; i < cap; i++) {
    const r = reversed[i];
    const ts = r.ts || "";
    let when = ts;
    const d = new Date(ts);
    if (!isNaN(d.getTime())) {
      const dPart = fmtDate.format(d);
      const tPart = fmtTime.format(d);
      when = (dPart === todayET) ? `${tPart} ET` : `${dPart} ${tPart} ET`;
    }
    lines.push(`${when}  ${formatFn(valueFn(r))}`);
  }
  if (history.length > cap) {
    lines.push(`… +${history.length - cap} older sample(s) not shown`);
  }
  return lines.join("\n");
};

function renderWatchList(data) {
  // Forward-looking card — what the bot is currently considering. Each row
  // is a candidate that cleared every gate in the strategy module (edge
  // the bot's filters, settlement window, etc.).
  // Sorted by |edge| descending. The data is read from a file cache that's
  // written as a side effect of each bot run — the dashboard never runs
  // scan_markets() itself (too slow, ~60s). This is a manual-scan workflow:
  // re-run main.py to refresh the cache.
  const w = data.watch_list || {};
  // Refresh button — embedded in every render branch (no-cache, empty,
  // populated). Clicking POSTs to /api/refresh_watch_list which spawns
  // the standalone scan script; the JS handler polls /api/watch_list_meta
  // and reloads the page once the cache mtime moves. Static HTML — the
  // mtime baseline is captured at click time, not page-render time, so
  // it's always accurate.
  // In demo mode the watch list is a frozen synthetic snapshot — the
  // refresh button has nothing to refresh against, so we omit it.
  const refreshBtnHtml = data.demo_mode ? "" : `
    <button type="button" class="wl-refresh-btn" id="wlRefreshBtn"
            title="Re-scan the watch list" aria-label="Refresh watch list"
            onclick="refreshWatchList(this)">↻</button>
    <span class="wl-refresh-status" id="wlRefreshStatus"></span>`;
  if (!w.ok) {
    return `<div class="card" style="grid-column: span 2;">
      <div class="card-title">Watch List ${refreshBtnHtml}</div>
      <div class="sub-stat neg">⚠ Couldn't load watch list: ${escapeHtml(w.error || "")}</div>
      <div class="help">Tap <strong>↻ Refresh</strong> above to run a scan and populate the cache, or run <code>main.py</code> from the terminal.</div>
    </div>`;
  }
  const candidates = w.candidates || [];
  // Build the freshness line — "scanned X min ago, cached" or "just scanned"
  const ageMin = w.age_seconds != null ? Math.round(w.age_seconds / 60) : null;
  const freshLabel = ageMin == null ? "" :
    (ageMin === 0 ? "scanned just now" :
     ageMin === 1 ? "scanned 1 min ago" :
     `scanned ${ageMin} min ago`);
  const cacheNote = w.from_cache ? ` <span class="muted">(from cache — re-run <code>main.py</code> to refresh)</span>` : "";

  if (candidates.length === 0) {
    return `<div class="card" style="grid-column: span 2;">
      <div class="card-title">Watch List ${refreshBtnHtml}</div>
      <div class="empty">No possible trades cleared the bot's filters this scan. Either market prices have caught up to the model, or no markets in the window meet the bot's edge threshold.</div>
      <div class="help">${escapeHtml(freshLabel)}${cacheNote}.</div>
    </div>`;
  }

  // Expected $ P&L preview is computed at the bot's per-trade dollar cap
  // (per-trade cap). It's just a forecast, not a
  // promise — actual contract count is floored to whole contracts and may
  // be further trimmed by Kelly / per-city / per-date caps. Hardcoded
  // here because the watch_list payload doesn't surface the env value;
  // bump if the per-trade cap changes.
  const PNL_PREVIEW_USD = 5.0;
  const rows = candidates.map(c => {
    const sideCls = c.side === "yes" ? "pos" : "neg";
    const edgeCls = c.edge > 0 ? "pos" : "neg";
    const edgePct = `${c.edge >= 0 ? "+" : ""}${(c.edge * 100).toFixed(1)}%`;
    const ourP = `${(c.our_prob * 100).toFixed(0)}%`;
    const mktP = `${(c.market_prob * 100).toFixed(0)}%`;
    // Per-contract cost (in dollars, 0..1) — side-aware. Pulled from the
    // book's far-side quote when available, falling back to market_prob.
    // Used for Entry, Cost, and Exp. P&L so all three columns agree.
    // Note: maker pricing would shave another ~1¢ off in our favor; we keep
    // the taker-side quote here for a conservative preview, matching what
    // Open Trades would show if we filled at the ask.
    let perContractCost;
    if (c.side === "yes") {
      perContractCost = (c.yes_ask != null) ? c.yes_ask : c.market_prob;
    } else {
      perContractCost = (c.yes_bid != null) ? (1 - c.yes_bid) : (1 - c.market_prob);
    }
    // Entry = per-contract cost in cents (mirrors Open Trades' Entry column).
    const entryStr = (perContractCost != null && perContractCost > 0)
      ? `${Math.round(perContractCost * 100)}¢`
      : "—";
    // Cost = projected $ for the actual trade size after the whole-contract
    // floor (mirrors Open Trades' Cost). per-trade-capped — Kelly /
    // per-city / per-date caps may trim it further at place-order time.
    let projectedCost = null;
    let nContracts = 0;
    if (perContractCost != null && perContractCost > 0) {
      nContracts = Math.floor(PNL_PREVIEW_USD / perContractCost);
      projectedCost = nContracts * perContractCost;
    }
    const costStr = projectedCost != null ? fmtUSD(projectedCost) : "—";
    // Expected P&L for a hypothetical PNL_PREVIEW_USD trade at the
    // counterparty side's best quote. Win probability is side-relative.
    let expectedPnl = null;
    if (perContractCost != null && perContractCost > 0) {
      const winProbForPnl = c.side === "yes" ? c.our_prob : (1 - c.our_prob);
      expectedPnl = PNL_PREVIEW_USD * (winProbForPnl - perContractCost) / perContractCost;
    }
    const pnlCls = expectedPnl == null ? "" : (expectedPnl >= 0 ? "pos" : "neg");
    const pnlStr = expectedPnl == null
      ? "—"
      : `${expectedPnl >= 0 ? "+" : ""}$${expectedPnl.toFixed(2)}`;
    // Side-relative win probability — our model's probability that THE BET
    // (not the YES outcome) pays out. For YES bets, that's our_prob; for NO
    // bets, it's 1 - our_prob. The existing Our/Mkt Prob columns both refer
    // to the YES outcome (Kalshi convention), which means the user has to
    // mentally invert them when reading a NO row. This collapses that
    // inversion into one number.
    const winProb = c.side === "yes" ? c.our_prob : (1 - c.our_prob);
    const winP = `${(winProb * 100).toFixed(0)}%`;
    // Win % delta vs. previous scan. _dashboard_data.watch_list() attaches
    // c.prev_our_prob (YES-outcome probability) when a (ticker, side) match
    // exists in the prior cache. Compare the *displayed* (rounded-to-int-%)
    // values rather than raw probabilities — that way we only color when the
    // visible number actually moved, avoiding noisy flashes on sub-percent
    // wiggles. Green = went up, red = went down, neutral = unchanged or new.
    let winCls = "";
    if (c.prev_our_prob != null) {
      const prevWinProb = c.side === "yes" ? c.prev_our_prob : (1 - c.prev_our_prob);
      const prevDisp = Math.round(prevWinProb * 100);
      const curDisp = Math.round(winProb * 100);
      const delta = curDisp - prevDisp;
      if (delta > 0) winCls = "pos";
      else if (delta < 0) winCls = "neg";
    }
    // Build the side-aware win-prob history for the tooltip.
    // c.history is a list of {ts, our_prob, market_prob, edge} written by
    // _watch_list_history.append_history() and capped at HISTORY_MAX_PER_KEY
    // per (ticker, side). We DON'T splice in the current scan row at the
    // end — the current scan was already appended to history by the same
    // refresh that wrote the cache, so it shows up as the last sample
    // already.
    const historyRaw = Array.isArray(c.history) ? c.history : [];
    const winTitle = buildHistoryTooltip(
      `Win % over time (${historyRaw.length} scan${historyRaw.length === 1 ? "" : "s"}, side-relative):`,
      historyRaw,
      r => c.side === "yes" ? r.our_prob : (1 - r.our_prob),
      v => v == null ? "—" : `${(v * 100).toFixed(0)}%`,
    );
    // Mkt Prob delta — colored from OUR perspective, not absolute direction.
    // For a YES bet, lower market_prob is better (cheaper to buy YES).
    // For a NO bet, higher market_prob is better (cheaper to buy NO since
    // NO cost = 1 - market_prob). This keeps the column's color semantics
    // consistent with Win % and Edge: green always means "moved in our favor".
    let mktCls = "";
    let mktTitle = "";
    if (c.prev_market_prob != null) {
      const prevMktDisp = Math.round(c.prev_market_prob * 100);
      const curMktDisp = Math.round(c.market_prob * 100);
      const rawDelta = curMktDisp - prevMktDisp;
      // Sign-flip for YES side so that "favorable to us" is always positive.
      const favorableDelta = c.side === "yes" ? -rawDelta : rawDelta;
      if (favorableDelta > 0) mktCls = "pos";
      else if (favorableDelta < 0) mktCls = "neg";
      const arrow = rawDelta > 0 ? "▲" : rawDelta < 0 ? "▼" : "·";
      const sign = rawDelta > 0 ? "+" : "";
      const dirNote = favorableDelta > 0 ? " (favorable)" : favorableDelta < 0 ? " (against us)" : "";
      mktTitle = `Last scan: ${prevMktDisp}% (${arrow} ${sign}${rawDelta} pp${dirNote})`;
    } else {
      mktTitle = "No prior scan to compare against";
    }
    // Edge delta — already signed (positive = favorable bet). Higher edge =
    // green, lower = red. This will often correlate with Win % and Mkt Prob
    // deltas, but it's a useful summary because edge captures both at once.
    let edgeDeltaCls = edgeCls;
    if (c.prev_edge != null) {
      // Compare raw edge values (4 decimals from cache) for tooltip precision,
      // but color on the displayed pp value to stay consistent with the Win%
      // and Mkt% logic — only color when the *visible* number changed.
      const prevEdgeDisp = (c.prev_edge * 100).toFixed(1);
      const curEdgeDisp = (c.edge * 100).toFixed(1);
      const deltaPp = parseFloat(curEdgeDisp) - parseFloat(prevEdgeDisp);
      // Override the static edgeCls (sign-of-edge) with delta-of-edge when
      // we have a prior scan: this matches the color semantics of the other
      // two delta columns. Edge sign is still legible from the +/- in the
      // value itself, so we don't lose information.
      if (deltaPp > 0) edgeDeltaCls = "pos";
      else if (deltaPp < 0) edgeDeltaCls = "neg";
      else edgeDeltaCls = "";
    }
    // Edge history → multi-row tooltip. We also inline the mkt-prob trail
    // in the tooltip text since the Watch List has no dedicated Mkt Prob
    // column (it's folded into this cell's tooltip). That gives Aaron
    // variance over time on the full bet thesis: model's win % (Win % cell),
    // edge (this cell), and the market price the edge was computed against.
    // Tooltip: header line, then per-scan rows with edge + mkt prob inline.
    let edgeTitle;
    if (historyRaw.length === 0) {
      edgeTitle = `No prior scans recorded yet | Our prob: ${ourP} · Mkt prob: ${mktP}`;
    } else {
      const headerLine = `Edge over time (${historyRaw.length} scan${historyRaw.length === 1 ? "" : "s"}; mkt prob in parens):`;
      const tooltipBody = buildHistoryTooltip(
        headerLine,
        historyRaw,
        r => r,
        r => {
          const e = r.edge;
          const mp = r.market_prob;
          const eStr = e == null ? "—" : `${e >= 0 ? "+" : ""}${(e * 100).toFixed(1)}%`;
          const mpStr = mp == null ? "—" : `${(mp * 100).toFixed(0)}%`;
          return `${eStr}  (mkt ${mpStr})`;
        },
      );
      edgeTitle = `${tooltipBody}\n\nNow: Our prob ${ourP} · Mkt prob ${mktP}`;
    }
    // Verdict cell precedence:
    //   1. placed_status set       → green "placed"/"filled" pill (Telegram-
    //      approved trade already in pnl.sqlite for this ticker+side, so the
    //      click-to-trade button would just duplicate the order)
    //   2. is_locked               → flat warn pill, NO click affordance per
    //      the LOCKED-bypass-distrust rule (memory: never bypass risk caps
    //      on is_locked opportunities; an early-pilot loss from a stale observation
    //      observations that disagreed with Kalshi settlement)
    //   3. otherwise               → click-to-trade button + status span
    let verdict;
    if (c.placed_status) {
      const label = c.placed_status === "filled" ? "filled" : "placed";
      verdict = `<span class="pill pill-good">${label}</span>`;
    } else if (c.is_locked) {
      verdict = `<span class="pill pill-warn">locked</span>`;
    } else if (data.demo_mode) {
      // No click-to-trade button in the demo — the synthetic candidates
      // wouldn't lead anywhere even if it were wired. A muted pill
      // matches the visual rhythm of the other Verdict cells without
      // implying interactivity.
      verdict = `<span class="pill pill-unknown">would trade</span>`;
    } else {
      verdict = `<button type="button" class="pill pill-action"
                  data-ticker="${escapeHtml(c.ticker)}"
                  data-side="${escapeHtml(c.side)}"
                  data-our-prob="${(c.our_prob * 100).toFixed(0)}"
                  data-market-prob="${(c.market_prob * 100).toFixed(0)}"
                  onclick="executeTrade(this)">would trade →</button>
         <span class="trade-status" data-ticker="${escapeHtml(c.ticker)}"></span>`;
    }
    const desc = c.bracket_description || c.ticker;
    return `<tr>
      <td class="mono">${escapeHtml(c.ticker)}</td>
      <td><span class="muted" style="font-size: 11px;">${escapeHtml(desc)}</span></td>
      <td class="${sideCls}" style="font-weight: 600;">${escapeHtml(c.side.toUpperCase())}${nContracts > 0 ? ` ${nContracts}` : ""}</td>
      <td class="numeric mono muted">${entryStr}</td>
      <td class="numeric">${costStr}</td>
      <td class="numeric mono ${winCls}" style="font-weight: 600; cursor: help;" title="${escapeHtml(winTitle)}">${winP}</td>
      <td class="numeric mono ${edgeDeltaCls}" style="font-weight: 600; cursor: help;" title="${escapeHtml(edgeTitle)}">${edgePct}</td>
      <td class="numeric mono ${pnlCls}" style="font-weight: 600;">${pnlStr}</td>
      <td>${verdict}</td>
    </tr>`;
  }).join("");

  return `
    <div class="card" style="grid-column: span 2;">
      <div class="card-title">Watch List (${candidates.length} possible trade${candidates.length === 1 ? "" : "s"}) ${refreshBtnHtml}</div>
      <div class="scrollable">
        <table>
          <thead><tr>
            <th>Ticker</th>
            <th>Bucket</th>
            <th>Side × Qty</th>
            <th class="numeric">Entry</th>
            <th class="numeric">Cost</th>
            <th class="numeric">Win %</th>
            <th class="numeric">Edge</th>
            <th class="numeric">Exp. P&amp;L</th>
            <th>Verdict</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="help">${data.demo_mode ? `Synthetic candidates. Sorted by edge magnitude. ${escapeHtml(freshLabel)}${cacheNote}. <strong>Entry</strong> = per-contract cost in cents. <strong>Cost</strong> = projected $ on a fill. <strong>Win %</strong> and <strong>Edge</strong> are color-coded vs. the last scan. Click-to-trade is disabled in this preview.` : `Live model output. Each row passed every filter in the bot's strategy module (the bot's filter set). Sorted by edge magnitude. ${escapeHtml(freshLabel)}${cacheNote}. <strong>Entry</strong> = per-contract cost in cents (side-aware: YES ask, or 1 − YES bid for NO). <strong>Cost</strong> = projected $ at the $5 max-trade preview after the whole-contract floor; mirrors what would land in Open Trades on a fill. <strong>Win %</strong> and <strong>Edge</strong> are color-coded vs. the last scan: <span class="pos">green</span> = moved in our favor, <span class="neg">red</span> = moved against us (hover any cell for the prior value and delta). Hover the Edge cell to see the underlying Our Prob / Mkt Prob breakdown. <strong>Exp. P&amp;L</strong> previews the expected dollar profit on the projected trade size — Kelly + per-city/per-date caps may trim it further in practice. <strong>Tap "would trade →"</strong> to launch a fresh scan for that single ticker; if it still passes the gates you'll get a Telegram approval prompt within ~60 seconds. Locked rows stay non-clickable.`}</div>
    </div>`;
}

function renderPnLChart(data) {
  const series = data.cumulative_pnl_series || [];
  if (series.length < 2) {
    return `<div class="card"><div class="card-title">Cumulative P&amp;L</div><div class="empty">Need at least 2 settled trades to draw a chart.</div></div>`;
  }
  // Inline SVG line chart — no Chart.js needed for ~10-100 data points.
  const W = 580, H = 200, pad = { l: 50, r: 16, t: 14, b: 28 };
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;
  const cums = series.map(s => s.cumulative_usd);
  const yMin = Math.min(0, ...cums);
  const yMax = Math.max(0, ...cums);
  const yPad = (yMax - yMin) * 0.1 || 1;
  const yLo = yMin - yPad, yHi = yMax + yPad;
  const xOf = (i) => pad.l + (series.length === 1 ? 0 : (i / (series.length - 1)) * innerW);
  const yOf = (v) => pad.t + ((yHi - v) / (yHi - yLo)) * innerH;
  const points = series.map((s, i) => `${xOf(i)},${yOf(s.cumulative_usd)}`).join(" ");
  // Each dot carries its own data via dataset attributes so the global
  // showPnlTip() handler can read them on mouseenter without us needing
  // to maintain a parallel JS array. Each dot now represents one full
  // settlement day (n_trades trades), not a single trade — the tooltip
  // shows the day's combined P&L plus the running total.
  const dots = series.map((s, i) => {
    const dateAttr = escapeHtml((s.settle_ts || "").slice(0, 10));
    const fill = s.cumulative_usd >= 0 ? "var(--pos-color)" : "var(--neg-color)";
    return `<circle class="pnl-dot" cx="${xOf(i)}" cy="${yOf(s.cumulative_usd)}" r="3.5" fill="${fill}" data-date="${dateAttr}" data-cum="${s.cumulative_usd}" data-pnl="${s.pnl_usd}" data-trades="${s.n_trades || 1}" data-wins="${s.wins || 0}" onmouseenter="showPnlTip(this)" onmouseleave="hidePnlTip()" />`;
  }).join("");
  // Y-axis labels — fill via CSS var so they invert correctly in dark mode
  const yLabels = [yLo, (yLo + yHi) / 2, yHi].map(v =>
    `<text x="${pad.l - 6}" y="${yOf(v) + 4}" text-anchor="end" font-size="10" fill="var(--chart-axis)">${fmtUSD(v, true)}</text>`
  ).join("");
  // Zero baseline
  const zeroLine = (yLo < 0 && yHi > 0)
    ? `<line x1="${pad.l}" y1="${yOf(0)}" x2="${pad.l + innerW}" y2="${yOf(0)}" stroke="var(--chart-zero)" stroke-dasharray="3,3" />`
    : "";
  // X-axis labels: first/middle/last
  const dateLabel = (s) => (s?.settle_ts || "").slice(5, 10);
  const xLabels = [
    `<text x="${pad.l}" y="${H - 8}" font-size="10" fill="var(--chart-axis)">${escapeHtml(dateLabel(series[0]))}</text>`,
    `<text x="${pad.l + innerW / 2}" y="${H - 8}" font-size="10" fill="var(--chart-axis)" text-anchor="middle">${escapeHtml(dateLabel(series[Math.floor(series.length / 2)]))}</text>`,
    `<text x="${pad.l + innerW}" y="${H - 8}" font-size="10" fill="var(--chart-axis)" text-anchor="end">${escapeHtml(dateLabel(series[series.length - 1]))}</text>`,
  ].join("");
  const lastCum = series[series.length - 1].cumulative_usd;
  const lineColor = lastCum >= 0 ? "var(--pos-color)" : "var(--neg-color)";
  // Lifetime WR badge in the card title — sums wins / trades across every
  // settled day in the series so the at-a-glance number on the card matches
  // what the per-day tooltip aggregates to.
  const totalTrades = series.reduce((acc, s) => acc + (s.n_trades || 0), 0);
  const totalWins = series.reduce((acc, s) => acc + (s.wins || 0), 0);
  const wrPct = totalTrades > 0 ? (totalWins / totalTrades) * 100 : 0;
  const wrCls = wrPct >= 50 ? "pos" : "neg";
  const wrBadge = totalTrades > 0
    ? ` &middot; <span class="${wrCls}">${wrPct.toFixed(0)}%</span> <span class="muted" style="font-weight: 400;">WR (${totalWins}/${totalTrades})</span>`
    : "";
  return `
    <div class="card" style="grid-column: span 2; position: relative;">
      <div class="card-title">Cumulative realized P&amp;L  (${series.length} day${series.length === 1 ? "" : "s"}${wrBadge})</div>
      <svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="display:block;">
        ${zeroLine}
        <polyline points="${points}" fill="none" stroke="${lineColor}" stroke-width="2" />
        ${dots}
        ${yLabels}
        ${xLabels}
      </svg>
      <div class="chart-tip" id="chart-tip"></div>
      <div class="help">Each dot = one settlement day (all trades that settled that day combined). Hover for the day's net P&amp;L, the trade count, and the running total. The cliff on 2026-04-29 was the lock-bypass disaster (already fixed in code; can no longer happen).</div>
    </div>`;
}

function renderHealthBadge(data) {
  const h = data.bot_health || {};
  const v = h.verdict || "unknown";
  const ageH = h.age_hours;
  let label;
  if (v === "ok") label = "✓ healthy";
  else if (v === "stale") label = "⚠ stale";
  else if (v === "overdue") label = "⚠ overdue";
  else if (v === "error") label = "✗ error";
  else label = "—";
  const ageStr = ageH != null ? ` · last run ${ageString(h.last_run_ts)}` : "";
  return `<span class="pill pill-${v}">${label}${ageStr}</span>`;
}

function renderRecentTrades(data) {
  // "Closed trades" — settled wins/losses only. Open positions live in
  // the Active Book section, so this card avoids the duplication.
  const trades = data.recent_trades || [];
  if (trades.length === 0) return `<div class="card"><div class="card-title">Closed trades</div><div class="empty">No closed trades yet.</div></div>`;
  const rows = trades.map(t => {
    const stateClass = t.state === "won" ? "pill-won" : "pill-lost";
    const pnlCell = t.pnl_usd !== null && t.pnl_usd !== undefined
      ? `<td class="numeric ${pnlClass(t.pnl_usd)}">${fmtUSD(t.pnl_usd, true)}</td>`
      : '<td class="muted">—</td>';
    // "Total won/lost" = gross dollar impact of this trade. On a win it's
    // n_contracts × $1.00 (Kalshi pays $1/contract — the cash that landed
    // on settlement, before netting out cost). On a loss it's -cost_usd
    // (the money that disappeared). For losers this is equivalent to P&L,
    // but kept here so the column is non-zero on every settled row.
    let totalWL = null;
    if (t.state === "won" && t.cost_usd != null && t.pnl_usd != null) {
      totalWL = t.cost_usd + t.pnl_usd;        // = qty × $1
    } else if (t.state === "lost" && t.cost_usd != null) {
      totalWL = -t.cost_usd;
    }
    const totalWLCell = totalWL !== null
      ? `<td class="numeric mono ${pnlClass(totalWL)}">${fmtUSD(totalWL, true)}</td>`
      : '<td class="muted">—</td>';
    const sideCls = t.side === "yes" ? "pos" : "neg";
    return `<tr>
      <td class="muted" style="font-size: 11px;">${escapeHtml((t.ts || "").split("T")[0])}</td>
      <td class="mono">${escapeHtml(t.ticker)}</td>
      <td class="${sideCls}">${escapeHtml(String(t.side || "").toUpperCase())} @${t.price_cents}¢</td>
      <td class="numeric">${t.n_contracts}</td>
      ${pnlCell}
      ${totalWLCell}
      <td><span class="pill ${stateClass}">${escapeHtml(t.state || "")}</span></td>
    </tr>`;
  }).join("");
  return `
    <div class="card" style="grid-column: span 2;">
      <div class="card-title">Closed trades (${trades.length})</div>
      <div class="scrollable">
        <table>
          <thead><tr><th>Date</th><th>Ticker</th><th>Side</th><th class="numeric">Qty</th><th class="numeric">P&amp;L</th><th class="numeric">W/L</th><th>Result</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

function renderMOS(data) {

}

function renderCLI(data) {

function renderSanityBanner(data) {
  const s = data.sanity;
  if (!s || !s.warnings || s.warnings.length === 0) return "";
  return s.warnings.map(w => `
    <div class="sanity-banner">
      <strong>${escapeHtml(w.title)}</strong>
      <div class="detail">${escapeHtml(w.detail)}</div>
    </div>`).join("");
}

function renderDemoBanner(data) {
  // The "What is GEO?" About card already explains the demo nature; we
  // don't want a second banner crowding the top of the page. Return
  // empty so the card layout starts cleanly with About → Snapshot.
  return "";
}

function render() {
  if (!DATA) {
    document.getElementById("content").innerHTML = '<div class="empty">No data baked into this dashboard.</div>';
    return;
  }
  document.getElementById("health-badge").innerHTML = renderHealthBadge(DATA);
  // Open-exposure pulse dot in the sticky title bar — green + pulsing when
  // the bot has any open weather positions, gray when in cash. The label
  // next to it spells out the count so the dot's meaning is self-evident.
  const _pulse = document.getElementById("geo-pulse");
  const _pulseLabel = document.getElementById("geo-pulse-label");
  if (_pulse) {
    const _nWx = ((DATA.kalshi || {}).n_positions) || 0;
    if (_nWx > 0) {
      _pulse.dataset.state = "active";
      _pulse.title = `${_nWx} open weather position${_nWx === 1 ? "" : "s"}`;
      if (_pulseLabel) _pulseLabel.textContent = `${_nWx} open`;
    } else {
      _pulse.dataset.state = "idle";
      _pulse.title = "No open positions — bot is in cash";
      if (_pulseLabel) _pulseLabel.textContent = "in cash";
    }
  }
  // "Last refreshed" stamp — every page load re-runs the snapshot, so
  // generated_at_utc IS when this view was refreshed (manual button,
  // pull-to-refresh, or initial open all hit the same code path).
  // Relative time ("2 min ago") rather than absolute clock time — the only
  // question this line answers is "is this view stale?", and relative time
  // answers it at a glance without mental math.
  const lr = document.getElementById("last-refreshed");
  if (lr && DATA.generated_at_utc) {
    lr.textContent = `Last refreshed ${ageString(DATA.generated_at_utc)}`;
  }
  // Each section wraps its header + cards in a <details open> element so
  // the user can collapse whole sections to reduce density. The <summary>
  // becomes the section header (same styling as before) with a chevron
  // that rotates when open/closed. Default: open.
  const row = (...cards) => `<div class="section-row">${cards.join("")}</div>`;
  // Slug from the section label so each <details> has a stable id we can
  // persist to localStorage. "Today's plan" → "today-s-plan", etc.
  const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const section = (label, ...rows) => `
    <details class="dash-section" data-section-id="${slug(label)}" open>
      <summary class="section-header"><span class="section-label"><span class="section-chevron">▾</span>${label}<span class="section-chevron">▾</span></span></summary>
      ${rows.join("")}
    </details>`;
  // sectionClosed — same as section() but starts collapsed. Use for
  // diagnostic / audit-only sections that aren't part of the daily glance.
  // Persistence still respects user toggle (localStorage geo-section-<slug>).
  const sectionClosed = (label, ...rows) => `
    <details class="dash-section" data-section-id="${slug(label)}">
      <summary class="section-header"><span class="section-label"><span class="section-chevron">▾</span>${label}<span class="section-chevron">▾</span></span></summary>
      ${rows.join("")}
    </details>`;
  // sectionLocked — for the public demo. Shows the section header but the
  // chevron is locked closed (clicking does nothing) and there is no data
  // behind it — neither in the DOM nor in window.DATA. The lock is the
  // visual signal "this section exists in the live build, redacted here."
  const sectionLocked = (label) => `
    <div class="dash-section dash-section-locked" data-section-id="${slug(label)}">
      <div class="section-header section-header-locked" role="presentation">
        <span class="section-label">
          <span class="section-chevron section-chevron-locked" aria-hidden="true">🔒</span>
          ${label}
          <span class="section-locked-pill">redacted in demo</span>
        </span>
      </div>
    </div>`;
  // DEMO_MODE LOCKDOWN — diagnostic and roadmap sections are rendered as
  // locked shells (visual presence kept, chevron locked, no data
  // underneath). The data behind them is also stripped from window.DATA
  // at the data-feed layer so DevTools spelunkers get nothing either.
  // The remaining sections show synthetic data through generic
  // prediction-market columns only.
  const isDemo = !!DATA.demo_mode;
  const sections = [
    // "What is GEO?" lives ABOVE the Snapshot section (not inside it) so it
    // remains visible when the user collapses Snapshot. It's a self-contained
    // <details> already, so it doesn't need a section() wrapper.
    row(renderAbout(DATA)),
    section("Snapshot",
      row(renderBalance(DATA), renderPnL(DATA), renderKPI(DATA)),
    ),
    section("Today's plan",
      row(renderWatchList(DATA)),
    ),
    // Active book — each card on its own row so Open Trades and Resting
    // Orders always stack vertically, never side-by-side. Aaron prefers
    // the stacked layout because side-by-side compresses the wide tables
    // (Open Trades has 9 columns) onto narrow cards. Adding a third card
    // here later (e.g. open settlements) just needs another row() call;
    // they'll stack automatically.
    isDemo
      ? section("Active book",
          row(renderPositions(DATA)),
        )
      : section("Active book",
          row(renderPositions(DATA)),
          row(renderRestingOrders(DATA)),
        ),
    isDemo
      ? section("Performance",
          row(renderRecentTrades(DATA)),
          row(renderPnLChart(DATA)),
        )
      : section("Performance",
          row(renderRecentTrades(DATA)),
          row(renderPnLChart(DATA), renderCalibration(DATA)),
        ),
    // Forecasts & observations section (MOS + CLI) was removed 2026-05-02.
    // renderMOS / renderCLI / dd.mos_forecasts / dd.cli_observations remain
    // in code for one-line revival when MOS leaves shadow mode.
    isDemo
      ? sectionLocked("Diagnostics")
      : sectionClosed("Diagnostics",
          row(renderBrierDrift(DATA)),
          row(renderSkips(DATA), renderArbs(DATA)),
        ),
    isDemo
      ? sectionLocked("Shipping/Shipped (RoadMap)")
      : section("Shipping/Shipped (RoadMap)",
          row(renderRoadmap(DATA)),
        ),
  ].join("");
  // Sanity banner is itself a leak surface (the warning text reveals which
  // internal invariant tripped); suppress it in demo mode.
  const sanityBanner = isDemo ? "" : renderSanityBanner(DATA);
  const demoBanner = renderDemoBanner(DATA);
  document.getElementById("content").innerHTML = `${demoBanner}${sanityBanner}<div class="grid">${sections}</div>`;
  // Wrap every table in a horizontal-scroll container so wide tables (open
  // positions has 8 columns) scroll inside their card on phones, and the
  // page itself never slides left/right.
  document.querySelectorAll('.card > table').forEach(t => {
    const wrap = document.createElement('div');
    wrap.className = 'table-scroll';
    t.parentNode.insertBefore(wrap, t);
    wrap.appendChild(t);
  });

  // Persist each <details> open/collapsed state across reloads. Keyed by
  // data-section-id so each section has its own slot in localStorage.
  // First we restore any persisted state, then we attach a toggle listener
  // to save changes on click. Sections without a stored value keep their
  // default — the about card stays closed, regular sections stay open.
  document.querySelectorAll('details[data-section-id]').forEach(el => {
    const id = el.dataset.sectionId;
    const key = 'geo-section-' + id;
    let stored = null;
    try { stored = localStorage.getItem(key); } catch (e) {}
    if (stored === 'open') el.setAttribute('open', '');
    else if (stored === 'collapsed') el.removeAttribute('open');
    el.addEventListener('toggle', () => {
      try { localStorage.setItem(key, el.open ? 'open' : 'collapsed'); } catch (e) {}
    });
  });
}
render();

// Number-counter animations on big-stat cards. Each animatable element has
// data-num-key (stable id, used as localStorage slot) and data-num-value
// (the raw numeric value the cell represents). On render we compare the
// new value to whatever was last persisted; if they differ meaningfully,
// we tween the displayed text from old → new with an ease-out cubic over
// ~500ms. First load = no prior value = no animation (silent display).
function _geoAnimateBigNumbers() {
  const fmt = (v, withSign) => {
    if (Number.isNaN(v)) return "—";
    const s = (v >= 0 ? "$" : "-$") + Math.abs(v).toFixed(2);
    return withSign && v > 0 ? "+" + s : s;
  };
  document.querySelectorAll("[data-num-key][data-num-value]").forEach(el => {
    const key = el.dataset.numKey;
    const target = parseFloat(el.dataset.numValue);
    if (Number.isNaN(target)) return;
    let start = target;
    try {
      const stored = localStorage.getItem("geo-num-" + key);
      if (stored !== null && stored !== "") {
        const n = parseFloat(stored);
        if (!Number.isNaN(n)) start = n;
      }
    } catch (e) { /* localStorage blocked — skip animation */ }
    try { localStorage.setItem("geo-num-" + key, String(target)); } catch (e) {}
    if (Math.abs(target - start) < 0.005) return; // first load or unchanged
    // Detect signed format from the original textContent — pnl uses +/− prefix
    const original = el.textContent.trim();
    const withSign = original.startsWith("+");
    const startTs = performance.now();
    const dur = 550;
    function step(now) {
      const t = Math.min(1, (now - startTs) / dur);
      const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
      const v = start + (target - start) * eased;
      el.textContent = fmt(v, withSign);
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}
_geoAnimateBigNumbers();

// Shooting-star spawner (dark mode only). Schedules itself recursively
// with a random 10–20s delay; each fire creates one .shooting-star div in
// .sticky-title-stars, runs its CSS animation, then removes itself. Stars
// only spawn when the page is in dark mode AND the tab is visible — no
// point burning frames on a hidden tab. Position is restricted to the
// 0–22% / 78–100% horizontal bands (matching the static starfield's
// exclusion zone) so a streak never crosses the GEO wordmark.
function _geoSpawnShootingStar() {
  const isDark = document.documentElement.dataset.theme === 'dark';
  const visible = document.visibilityState === 'visible';
  const container = document.querySelector('.sticky-title-stars');
  if (isDark && visible && container) {
    const star = document.createElement('div');
    star.className = 'shooting-star';
    // Avoid the central 25–75% band. Coin flip picks left or right side.
    const onLeft = Math.random() < 0.5;
    const leftPct = onLeft ? Math.random() * 22 : 78 + Math.random() * 22;
    const topPx = Math.random() * 110; // bar is ~150px tall, leave room for trail
    star.style.left = leftPct + '%';
    star.style.top = topPx + 'px';
    container.appendChild(star);
    // CSS animation is 1.3s; schedule cleanup slightly after.
    setTimeout(() => star.remove(), 1500);
  }
  const nextDelayMs = 10000 + Math.random() * 10000; // 10–20s
  setTimeout(_geoSpawnShootingStar, nextDelayMs);
}
// Kick off the loop with a short initial delay so the page settles first.
setTimeout(_geoSpawnShootingStar, 3000);
</script>
