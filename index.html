  const cum = parseFloat(circle.dataset.cum);
  // "2026-04-30" → "Apr 30, 2026" — friendlier read than the raw ISO date.
  const friendlyDate = (() => {
    const d = new Date(date + "T12:00:00Z");
    if (Number.isNaN(d.getTime())) return date;
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
  })();
  const pnlCls = pnl >= 0 ? "tip-pos" : "tip-neg";
  const cumCls = cum >= 0 ? "tip-pos" : "tip-neg";
  const sign = (n) => (n >= 0 ? "+" : "-") + "$" + Math.abs(n).toFixed(2);
  // Daily win rate — color-coded against 50% so the eye finds bad days fast.
  // 0/0 days never get rendered (we only emit a dot when n_trades > 0), but
  // the guard keeps NaN out of the DOM if the data shape ever shifts. The
  // "(wins/trades)" suffix carries the daily trade count, so the previous
  // standalone "N trades" line was dropped to avoid the redundancy.
  const wr = trades > 0 ? (wins / trades) * 100 : 0;
  const wrCls = wr >= 50 ? "tip-pos" : "tip-neg";
  tip.innerHTML = `
    <div class="tip-date">${escapeHtml(friendlyDate)}</div>
    <div class="tip-row">Win rate: <span class="${wrCls}">${wr.toFixed(0)}%</span> <span class="muted">(${wins}/${trades})</span></div>
    <div class="tip-row">Day P&amp;L: <span class="${pnlCls}">${sign(pnl)}</span></div>
    <div>Cumulative: <span class="${cumCls}">${sign(cum)}</span></div>
  `;
  // Position the tip above the dot, in card-relative coordinates.
  const card = circle.closest(".card");
  if (!card) return;
  const dotRect = circle.getBoundingClientRect();
  const cardRect = card.getBoundingClientRect();
  tip.style.left = (dotRect.left - cardRect.left + dotRect.width / 2) + "px";
  tip.style.top  = (dotRect.top  - cardRect.top) + "px";
  tip.classList.add("visible");
}
function hidePnlTip() {
  const tip = document.getElementById("chart-tip");
  if (tip) tip.classList.remove("visible");
}

// Calibration plot hover tooltip — same pattern as showPnlTip but reads
// the bucket's predicted/observed/N fields and labels them so the user
// learns the chart's vocabulary by hovering.
function showCalTip(circle) {
  const tip = document.getElementById("cal-tip");
  if (!tip) return;
  const pred = parseFloat(circle.dataset.pred);
  const obs = parseFloat(circle.dataset.obs);
  const n = parseInt(circle.dataset.n, 10);
  const won = parseInt(circle.dataset.won, 10);
  const range = circle.dataset.range || "";
  // Three rows mapping directly to the chart axes + the underlying count:
  //   Predicted  → x-coordinate of the bubble
  //   Observed   → y-coordinate of the bubble (matches the y-axis label)
  //   Win rate   → the won/n fraction the observed percent comes from
  // The bubble's distance from the diagonal already conveys over/under-
  // confidence visually; we don't repeat that as a numeric gap here.
  tip.innerHTML = `
    <div class="tip-date">${escapeHtml(range)}% bucket</div>
    <div class="tip-ticker">${n} trade${n === 1 ? "" : "s"}</div>
    <div class="tip-row">Predicted: <span style="font-family: monospace;">${(pred * 100).toFixed(1)}%</span></div>
    <div>Observed: <span style="font-family: monospace;">${(obs * 100).toFixed(1)}%</span></div>
    <div>Win rate: <span style="font-family: monospace;">${won}/${n}</span></div>
  `;
  const card = circle.closest(".card");
  if (!card) return;
  const dotRect = circle.getBoundingClientRect();
  const cardRect = card.getBoundingClientRect();
  tip.style.left = (dotRect.left - cardRect.left + dotRect.width / 2) + "px";
  tip.style.top = (dotRect.top - cardRect.top) + "px";
  tip.classList.add("visible");
}
function hideCalTip() {
  const tip = document.getElementById("cal-tip");
  if (tip) tip.classList.remove("visible");
}

function renderAbout(data) {
  return (data && data.about_html) ? data.about_html : "";
}

function renderBalance(data) {
  // Both numbers come from a single Kalshi /balance call:
  //   balance_usd   = cash sitting in the wallet
  //   portfolio_usd = value of open positions at current market mids
  //                   (Kalshi's API calls THIS "portfolio_value", but
  //                   Kalshi's UI uses "Portfolio" to mean cash + positions
  //                   — i.e. the all-in account total. We mirror the UI here
  //                   so the right-hand number matches what Aaron sees on
  //                   kalshi.com without mental math.)
  // n_positions       = weather (KXHIGH) positions only — bot scope
  // n_positions_total = all positions, so a manual non-weather play doesn't
  //                     vanish from the count
  const k = data.kalshi || {};
  const cash = k.balance_usd ?? null;
  const positionValue = k.portfolio_usd ?? null;
  const portfolioTotal = (cash != null && positionValue != null) ? cash + positionValue : null;
  // Weather-bot dashboard scope: count and surface only the weather (KXHIGH)
  // positions. Manual non-weather bets (e.g. KXMUSKOAI) still affect the
  // portfolio total via Kalshi's portfolio_value field, but they don't
  // belong in this card's count line — that's about what THE BOT is doing.
  const nWx = k.n_positions ?? 0;
  const positionLine = nWx === 0
    ? "No open weather positions"
    : `${nWx} open weather &middot; ${fmtUSD(positionValue)} in positions`;
  const error = !k.ok ? `<div class="sub-stat neg">⚠ ${escapeHtml(k.error || "")}</div>` : "";
  return `
    <div class="card">
      <div class="card-title">Account balance</div>
      <div class="kpi-row">
        <div>
          <div class="big-number neutral" data-num-key="cash" data-num-value="${cash ?? ''}">${fmtUSD(cash)}</div>
          <div class="sub-stat">Cash balance</div>
        </div>
        <div>
          <div class="big-number neutral" data-num-key="portfolio" data-num-value="${portfolioTotal ?? ''}">${fmtUSD(portfolioTotal)}</div>
          <div class="sub-stat">Portfolio total <span class="muted">(cash + positions)</span></div>
        </div>
      </div>
      <div class="sub-stat" style="margin-top: 8px;">${positionLine}</div>
      ${error}
    </div>`;
}

function renderPnL(data) {
  const p = data.pnl || {};
  const all = p.realized_all ?? 0, _24h = p.realized_24h ?? 0, _7d = p.realized_7d ?? 0;
  const won = p.n_won ?? 0, lost = p.n_lost ?? 0;
  const winRate = p.win_rate != null ? `${(p.win_rate * 100).toFixed(0)}%` : "—";
  // W/L pill — green wins, red losses, neutral win-rate. Reads "5W / 9L · 36% win rate".
  const wlLine = (won + lost) === 0
    ? `<div class="sub-stat">No settled trades yet.</div>`
    : `<div class="sub-stat"><span class="pos" style="font-weight: 600;">${won}W</span> / <span class="neg" style="font-weight: 600;">${lost}L</span> · ${winRate} win rate</div>`;
  return `
    <div class="card">
      <div class="card-title">Profits &amp; Losses</div>
      <div class="big-number ${pnlClass(all)}" data-num-key="pnl_all" data-num-value="${all ?? ''}">${fmtUSD(all, true)}</div>
      ${wlLine}
      <div class="sub-stat">Last 24h: <span class="${pnlClass(_24h)}">${fmtUSD(_24h, true)}</span> · 7d: <span class="${pnlClass(_7d)}">${fmtUSD(_7d, true)}</span></div>
      <div class="sub-stat">${p.n_settled ?? 0} settled · ${p.n_trades ?? 0} total · open cost ${fmtUSD(p.open_cost_usd)}</div>
    </div>`;
}

function renderKPI(data) {
  const k = data.kpi || {};
  const n = k.n_settled ?? 0;
  const sampleTip = "Sample size — number of settled trades feeding these KPIs. Below 30 the headline numbers are dominated by statistical noise (a single $5 win/loss can swing ROI by several points), so KPIs are flagged 'preliminary' until N≥30 when Wilson-style CIs tighten enough to support decisions like cap raises.";
  const sampleWarn = n < 30
    ? `<div class="sub-stat"><span class="pill pill-warn" style="cursor: help;" title="${escapeHtml(sampleTip)}">N=${n} — preliminary</span></div>`
    : `<div class="sub-stat"><span class="pill pill-good" style="cursor: help;" title="${escapeHtml(sampleTip)}">N=${n} — usable</span></div>`;
  const ratio = k.edge_realization_ratio ?? null;

  // Per-family breakdown table (B-buckets vs T-tails). Only rendered if
  // we have at least one settled bucket OR tail trade — pre-launch this
  // collapses to nothing instead of an empty table. Edge realization is
  // the headline metric per family because it's the single most diagnostic
  // number for whether the bot's edge claim is actually being captured.
  const fam = k.by_family || {};
  const famOrder = ["bucket", "tail", "unknown"];
  const famLabel = { bucket: "B-buckets", tail: "T-tails", unknown: "Other" };
  const famRows = famOrder
    .filter(key => fam[key] && fam[key].n > 0)
    .map(key => {
      const f = fam[key];
      const r = f.edge_realization_ratio;
      const roiCell = f.roi != null ? `<span class="${pnlClass(f.roi)}">${fmtPct(f.roi)}</span>` : '<span class="muted">—</span>';
      const ratioCell = r != null ? `<span class="${pnlClass(r)}">${r.toFixed(2)}</span>` : '<span class="muted">—</span>';
      const pnlCell = `<span class="${pnlClass(f.realized_pnl)}">${fmtUSD(f.realized_pnl, true)}</span>`;
      return `<tr>
        <td>${famLabel[key]}</td>
        <td class="numeric muted">${f.n}</td>
        <td class="numeric mono">${roiCell}</td>
        <td class="numeric mono">${f.brier ?? "—"}</td>
        <td class="numeric mono">${ratioCell}</td>
        <td class="numeric mono">${pnlCell}</td>
      </tr>`;
    }).join("");
  // Per-family breakdown renders in demo mode too (2026-07 unlock): the
  // bucket-vs-tail split is public ticker structure, and the demo's
  // numbers are synthetic. The claimed-edge dollar fields are still
  // stripped from the payload at the data layer.
  const breakdown = (!famRows)
    ? ""
    : `<table style="margin-top: 12px; font-size: 11px;">
         <thead><tr>
           <th>Family</th>
           <th class="numeric">N</th>
           <th class="numeric">ROI</th>
           <th class="numeric">Brier</th>
           <th class="numeric">Edge real.</th>
           <th class="numeric">P&amp;L</th>
         </tr></thead>
         <tbody>${famRows}</tbody>
       </table>
       <div class="help">B-buckets = 1°-wide windows (e.g. B62.5 = 62–63°F). T-tails = cold/hot tail markets (e.g. T54 = high &lt; 54°F). Watch each family's contribution to overall performance.</div>`;

  return `
    <div class="card">
      <div class="card-title">KPI snapshot</div>
      <div class="kpi-row">
        <div><div class="big-number ${pnlClass(k.roi)}" style="font-size: 18px;">${k.roi != null ? fmtPct(k.roi) : "—"}</div><div class="sub-stat">ROI</div></div>
        <div title="${escapeHtml("Brier score — average squared error of the bot's predicted probability vs the actual outcome. For each settled trade, take (p_model − outcome)², where outcome=1 if the contract resolved YES else 0; the Brier score is the mean across all settled trades. Lower is better: 0.00 = perfect, 0.25 = coin-flip baseline, 1.00 = consistently confident and wrong. A proper score, so a model can't game it without genuinely improving.")}" style="cursor: help;"><div class="big-number neutral" style="font-size: 18px;">${n === 0 ? "—" : (k.brier ?? "—")}</div><div class="sub-stat">Brier (0.25=coin)</div></div>
        <div title="${escapeHtml("Edge realization ratio — does the bot's claimed edge translate into realized P&L? For each trade, claimed edge $ = (our_prob − market_mid) × size, i.e. the dollars the model said it should earn in expectation. The ratio is sum(realized P&L) / sum(claimed edge $) across settled trades. Reading: 1.00 = the model is capturing exactly the edge it claims; >1.00 = capturing more than predicted (often noise at small N); 0.0–0.5 = claimed edge isn't materializing (filter or sizing issue); <0 = bot has been on the wrong side of the market on net. Headline diagnostic — separates 'is the model right?' (Brier) from 'is the right model making money?' (this).")}" style="cursor: help;"><div class="big-number ${pnlClass(ratio)}" style="font-size: 18px;">${ratio == null ? "—" : ratio.toFixed(2)}</div><div class="sub-stat">Edge realization</div></div>
      </div>
      ${sampleWarn}
      ${breakdown}
    </div>`;
}

function renderPositions(data) {
  // Enriched per-position data is on data.open_trades; live counts are on data.kalshi.positions.
  // Cross-index by ticker for the unified card.
  const liveByTicker = {};
  for (const p of ((data.kalshi || {}).positions || [])) liveByTicker[p.ticker] = p;
  const trades = data.open_trades || [];
  if (trades.length === 0) {
    // Friendlier empty state — when the bot is in cash, surface the watch
    // list count so the user knows the bot is still actively scanning.
    const wlCount = ((data.watch_list || {}).candidates || []).length;
    const wlNote = wlCount > 0
      ? ` Watching ${wlCount} possible trade${wlCount === 1 ? "" : "s"} in the Watch List above.`
      : ` No candidates currently passing the bot's filters.`;
    return `<div class="card"><div class="card-title">Open Trades (live)</div><div class="empty">Bot is in cash.${wlNote}</div></div>`;
  }

  const verdictPill = (v, detail) => {
    const label = { agree: "✓ Agree", disagree: "⚠ Disagree", split: "≈ Split", unknown: "—" }[v] || "—";
    // Always emit a tooltip — even on "unknown" pills — so the user can hover
    // to see *why* MOS data isn't available (typically: stale mos_forecasts
    // table because the snapshot loop hasn't logged a fresh bulletin).
    const body = detail || "Guidance data unavailable";
    return `<span class="pill pill-${v || "unknown"}" title="${escapeHtml(body)}" style="cursor: help;">${label}</span>`;
  };

  // Build the Forecast verdict tooltip body for one trade. Multi-line so the user
  // sees: bracket + bet side, per-model forecast + which side it favors, and
  // the combined verdict in plain English. For unknown verdicts, explain the
  // specific reason (stale table / no station / ticker unparseable) so the
  // hover is informative instead of the old empty string.
  const VERDICT_PHRASE = {
    agree: "Both guidance sources agree with the bet",
    disagree: "Both guidance sources disagree with the bet",
    split: "Guidance sources are split",
    unknown: "Guidance data unavailable",
  };
  const buildMosTooltip = (trade) => {
    const verdict = (trade.mos_verdict || {}).verdict || "unknown";
    const sideLabel = String(trade.side || "").toUpperCase();
    const bracket = trade.bracket_description || "—";
    const header = sideLabel ? `Bet: ${sideLabel} · ${bracket}` : `Bracket: ${bracket}`;
    const lines = [header];
    const fmtModel = (name, temp, favored) => {
      if (temp == null) return `${name}  no forecast`;
      const favLabel = favored === "yes_wins" ? "→ favors YES"
                     : favored === "no_wins"  ? "→ favors NO"
                     : "";
      const sideMatches = (favored === "yes_wins" && trade.side === "yes")
                       || (favored === "no_wins"  && trade.side === "no");
      const mark = favored == null ? ""
                  : sideMatches    ? " ✓"
                  :                  " ✗";
      return `${name}  ${temp}°F  ${favLabel}${mark}`.replace(/\s+/g, " ").trim();
    };
    lines.push(fmtModel("Guidance A", trade.mos_gfs_max, (trade.mos_verdict || {}).a));
    lines.push(fmtModel("Guidance B", trade.mos_nam_max, (trade.mos_verdict || {}).b));
    if (verdict === "unknown") {
      const reason = trade.mos_unknown_reason;
      const station = trade.mos_station;
      let why;
      if (reason === "ticker_unparseable") {
        why = "Ticker could not be parsed into a bracket — no guidance comparison possible.";
      } else if (reason === "no_station_mapping") {
        why = `No guidance source mapped for ${trade.city || "this city"}.`;
      } else if (reason === "no_forecast_row") {
        const tgt = trade.target_date || "this date";
        why = `No guidance forecast logged for ${station || "this station"} on ${tgt}. The mos_forecasts table is likely stale — the snapshot loop refreshes it on each run.`;
      } else {
        why = "Guidance data unavailable.";
      }
      lines.push(`Verdict: ${VERDICT_PHRASE[verdict]}`);
      lines.push(why);
    } else {
      lines.push(`Verdict: ${VERDICT_PHRASE[verdict] || verdict}`);
    }
    return lines.join("\n");
  };

  // Format a UTC ISO timestamp ("2026-05-05T14:23:45+00:00") into a compact
  // local-time stamp like "May 5, 2:23 PM". Falls back to "—" if missing.
  // For multi-fill positions, prefer the earliest fill ts (when the bet was
  // first placed); the data layer surfaces this as `first_fill_ts`.
  const fmtPlacedTs = (iso) => {
    if (!iso) return `<span class="muted">—</span>`;
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return `<span class="muted">${escapeHtml(iso)}</span>`;
    const dateStr = d.toLocaleDateString([], { month: "numeric", day: "numeric" });
    const timeStr = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    return `<span class="muted" style="font-size: 11px;">${escapeHtml(dateStr)}, ${escapeHtml(timeStr)}</span>`;
  };

  const rows = trades.map(t => {
    const live = liveByTicker[t.ticker] || {};
    const sideCls = t.side === "yes" ? "pos" : "neg";
    const v = (t.mos_verdict || {}).verdict || "unknown";
    // Multi-line tooltip: bracket + bet, per-model forecasts with check/cross
    // for "agrees with our side", and a plain-English verdict line. Renders
    // even when verdict='unknown' so the user can see *why* MOS data isn't
    // available (most common cause: stale mos_forecasts table).
    const mosDetailTip = buildMosTooltip(t);
    const settlement = (t.settlement || {}).label || "—";
    // For multi-fill positions, "Placed" shows the earliest fill ts so the
    // user sees when the position was first opened, not when it was last
    // added to. The ×N indicator on the entry-price cell already flags
    // multi-fill aggregation if they want the gory detail.
    const placedTs = t.first_fill_ts || t.ts;
    const mid = t.current_yes_mid;
    // Kalshi Win % = market-implied probability your position pays out — the
    // same number Kalshi shows on each open bet in its positions page.
    // For YES bets it equals the YES mid; for NO bets it's (1 - YES mid).
    // Color: green when winning, red when not.
    const kalshiWinProb = mid != null ? (t.side === "yes" ? mid : (1 - mid)) : null;
    // Build the side-aware market-implied win-prob trajectory for the
    // tooltip. Same data source (.watch_list_history.jsonl, attached in
    // enrich_open_positions) and same buildHistoryTooltip helper. We map
    // market_prob (not our_prob) because this cell shows the market-implied
    // win prob — the tooltip should track the *cell value* over time, not
    // the model's confidence. For NO bets, win prob = 1 - market_prob; for
    // YES, = market_prob.
    const historyRaw = Array.isArray(t.history) ? t.history : [];
    const kalshiWinTitle = historyRaw.length === 0
      ? "No prior scans recorded for this ticker"
      : buildHistoryTooltip(
          `Kalshi Win % over time (${historyRaw.length} scan${historyRaw.length === 1 ? "" : "s"}, market-implied):`,
          historyRaw,
          r => r.market_prob == null ? null : (t.side === "yes" ? r.market_prob : (1 - r.market_prob)),
          v => v == null ? "—" : `${(v * 100).toFixed(0)}%`,
        );
    const kalshiWinTitleAttr = ` title="${escapeHtml(kalshiWinTitle)}" style="cursor: help;"`;
    // Left-aligned so the percent value sits flush against the Bot Win %
    // column instead of floating at the right edge of the header-wide cell —
    // Aaron asked 2026-05-11 to bring the two numbers visually together.
    const kalshiWinCell = kalshiWinProb != null
      ? `<td class="mono ${kalshiWinProb >= 0.5 ? 'pos' : 'neg'}"${kalshiWinTitleAttr}>${(kalshiWinProb * 100).toFixed(0)}%</td>`
      : `<td class="muted"${kalshiWinTitleAttr}>—</td>`;
    // Bot Win % = the model's side-relative probability of the bet paying
    // out, mirroring the Watch List column. Source-of-truth precedence:
    //   1. latest history sample's our_prob (freshest model output for this
    //      ticker — same behavior as the Watch List)
    //   2. t.our_prob (fill-time value persisted with the trade row)
    // The gap between this and Kalshi Win % is the bot's edge in win-prob
    // units. Tooltip shows the model's trajectory across all recorded scans.
    const latestHist = historyRaw.length > 0 ? historyRaw[historyRaw.length - 1] : null;
    const botProbSrc = (latestHist && latestHist.our_prob != null) ? latestHist.our_prob : t.our_prob;
    const botWinProb = botProbSrc != null
      ? (t.side === "yes" ? botProbSrc : (1 - botProbSrc))
      : null;
    const botWinTitle = historyRaw.length === 0
      ? "No prior scans recorded for this ticker"
      : buildHistoryTooltip(
          `Bot Win % over time (${historyRaw.length} scan${historyRaw.length === 1 ? "" : "s"}, side-relative):`,
          historyRaw,
          r => r.our_prob == null ? null : (t.side === "yes" ? r.our_prob : (1 - r.our_prob)),
          v => v == null ? "—" : `${(v * 100).toFixed(0)}%`,
        );
    const botWinTitleAttr = ` title="${escapeHtml(botWinTitle)}" style="cursor: help;"`;
    const botWinCell = botWinProb != null
      ? `<td class="numeric mono ${botWinProb >= 0.5 ? 'pos' : 'neg'}"${botWinTitleAttr}>${(botWinProb * 100).toFixed(0)}%</td>`
      : `<td class="muted"${botWinTitleAttr}>—</td>`;
    const mtmCell = t.unrealized_pnl_usd != null
      ? `<td class="numeric ${pnlClass(t.unrealized_pnl_usd)}">${fmtUSD(t.unrealized_pnl_usd, true)}</td>`
      : `<td class="muted">—</td>`;
    // W/L — projected gross dollar impact at current mid, mirroring the
    // closed-trades W/L column. Closed picks the branch by settled state;
    // for open positions we use Kalshi Win % ≥ 50% as the "currently
    // winning side" proxy (matches the natural reading and the P&L cell
    // direction). On a projected win it's n_contracts × $1.00 (the cash
    // that WOULD land); on a projected loss it's -cost_usd (what WOULD
    // disappear). Italic + "(proj)" tooltip to flag that it's unsettled.
    let projWL = null;
    if (kalshiWinProb != null && t.cost_usd != null && t.n_contracts != null) {
      projWL = kalshiWinProb >= 0.5 ? t.n_contracts * 1.0 : -t.cost_usd;
    }
    const wlCell = projWL !== null
      ? `<td class="numeric mono ${pnlClass(projWL)}" style="font-style: italic;" title="Projected gross W/L if this settles at the current Kalshi mid (Kalshi Win % ${kalshiWinProb != null ? (kalshiWinProb * 100).toFixed(0) + '%' : '—'}). Win = qty × $1; Loss = -cost.">${fmtUSD(projWL, true)}</td>`
      : '<td class="muted">—</td>';
    const bucketDesc = t.bracket_description || "";
    return `<tr>
      <td class="mono">${escapeHtml(t.ticker)}</td>
      <td><span class="muted" style="font-size: 11px;">${escapeHtml(bucketDesc)}</span></td>
      <td>${fmtPlacedTs(placedTs)}</td>
      <td><span class="muted" style="font-size: 11px;">${escapeHtml(settlement)}</span></td>
      <td class="${sideCls}">${escapeHtml(String(t.side || "").toUpperCase())} ${t.n_contracts}</td>
      <td class="numeric muted">@${t.price_cents}¢${t._n_fills > 1 ? ` <span style="font-size: 9px;">avg ×${t._n_fills}</span>` : ""}</td>
      <td class="numeric">${fmtUSD(t.cost_usd)}</td>
      ${botWinCell}
      ${kalshiWinCell}
      ${mtmCell}
      ${wlCell}
      <td>${verdictPill(v, mosDetailTip)}</td>
    </tr>`;
  }).join("");

  return `
    <div class="card" style="grid-column: span 2;">
      <div class="card-title">Open Trades (${trades.length})</div>
      <div class="scrollable">
        <table class="positions-table">
          <thead><tr>
            <th>Ticker</th>
            <th>Bucket</th>
            <th>Placed</th>
            <th>Settles</th>
            <th>Side × Qty</th>
            <th class="numeric">Entry</th>
            <th class="numeric">Cost</th>
            <th class="numeric">Bot Win %</th>
            <th>Kalshi Win %</th>
            <th class="numeric">P&amp;L</th>
            <th class="numeric">W/L</th>
            <th>Forecast verdict</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="help">Bot Win % = our model's probability that THE BET pays out (side-relative; sourced from the freshest scan available for this ticker). Kalshi Win % = market-implied probability of the same outcome — the number Kalshi shows on each open bet. The gap between the two columns is the bot's edge in win-probability units. Hover either cell for the full scan-by-scan trajectory. P&amp;L = what we'd make or lose if we sold each position right now at the current Kalshi mid (unrealized — these positions haven't settled yet). W/L = projected gross dollar impact if this settles at the current Kalshi mid (italic to flag projected, not settled): qty × $1 if Kalshi Win % ≥ 50%, else -cost. Verdict comes from a secondary forecast source.${data.n_phantom_open_trades > 0 ? ` <span class="muted">${data.n_phantom_open_trades} DB row${data.n_phantom_open_trades === 1 ? "" : "s"} marked open but not held on Kalshi were filtered (likely cancelled fills — DB drift to investigate).</span>` : ""}</div>
    </div>`;
}

// Multi-row tooltip for a Watch List history series. Renders as plain text
// in the HTML title attribute — newlines come through as line breaks in
// native browser tooltips. `format(value)` formats each historical sample.
// `tsFormat(ts)` shortens timestamps to HH:MM (UTC) or "MMM D" if older
// than today; native tooltip = no styling, so legibility comes from spacing.
const buildHistoryTooltip = (header, history, valueFn, formatFn) => {
  if (!history || history.length === 0) return "No prior scans recorded yet";
  // Newest first — matches how the user reads dashboards. Show up to 12
  // entries; older samples are summarized in a trailing line.
  const lines = [header];
  const reversed = history.slice().reverse();
  const cap = Math.min(reversed.length, 12);
  // Display timestamps in Eastern time — that's the user's local trading
  // frame and matches how Kalshi documents settlement windows. History rows
  // are persisted as ISO UTC ("...T01:40:00+00:00") in the cache file.
  const tz = "America/New_York";
  // 12-hour clock with AM/PM — matches how the user reads times in chat.
  const fmtTime = new Intl.DateTimeFormat("en-US", {
    timeZone: tz, hour: "numeric", minute: "2-digit", hour12: true,
  });
  // en-CA gives "YYYY-MM-DD" — convenient for the today-vs-older comparison.
  const fmtDate = new Intl.DateTimeFormat("en-CA", {
    timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit",
  });
  const todayET = fmtDate.format(new Date());
  for (let i = 0; i < cap; i++) {
    const r = reversed[i];
    const ts = r.ts || "";
    let when = ts;
    const d = new Date(ts);
    if (!isNaN(d.getTime())) {
      const dPart = fmtDate.format(d);
      const tPart = fmtTime.format(d);
      when = (dPart === todayET) ? `${tPart} ET` : `${dPart} ${tPart} ET`;
    }
    lines.push(`${when}  ${formatFn(valueFn(r))}`);
  }
  if (history.length > cap) {
    lines.push(`… +${history.length - cap} older sample(s) not shown`);
  }
  return lines.join("\n");
};

function renderWatchList(data) {
  // Forward-looking card — what the bot is currently considering. Each row
  // is a candidate that cleared every gate in the strategy module (edge
  // the bot's filters, settlement window, etc.).
  // Sorted by |edge| descending. The data is read from a file cache that's
  // written as a side effect of each bot run — the dashboard never runs
  // scan_markets() itself (too slow, ~60s). This is a manual-scan workflow:
  // re-run main.py to refresh the cache.
  const w = data.watch_list || {};
  // Compute circuit state EARLY so the Refresh button can react to it.
  // When any Open-Meteo host is OPEN, the button is disabled + red and the
  // server-side _refresh_watch_list.py early-exits (avoids probe-failure
  // reset + cache pollution). See 2026-05-20 ship for the deepening fix.
  const circuit = w.circuit_state || {};
  // Blend-critical hosts (multi-model forecast hosts) gate
  // the Refresh button + the server-side bail-out: an OPEN circuit there means
  // the scan is running near-blind. A non-critical leg like NWS
  // (api.weather.gov) going dark only drops the blend to N-1 models, so it
  // surfaces as an informational badge and must NOT disable Refresh.
  // (2026-06-02 card #22: NWS circuit-breaker parity.)
  const isCriticalHost = (h) => h.includes("open-meteo");
  const openHosts = Object.entries(circuit).filter(([h, s]) => s.state === "open" && isCriticalHost(h));
  const halfOpenHosts = Object.entries(circuit).filter(([h, s]) => s.state === "half_open" && isCriticalHost(h));
  const degradedHosts = Object.entries(circuit).filter(([h, s]) => (s.state === "open" || s.state === "half_open") && !isCriticalHost(h));
  const circuitOpen = openHosts.length > 0;
  const circuitOpenRemainMin = circuitOpen
    ? Math.max(1, Math.ceil(
        Math.min(...openHosts.map(([, s]) => s.open_remaining_sec || 0)) / 60
      ))
    : 0;

  // Refresh button — embedded in every render branch (no-cache, empty,
  // populated). Clicking POSTs to /api/refresh_watch_list which spawns
  // the standalone scan script; the JS handler polls /api/watch_list_meta
  // and reloads the page once the cache mtime moves. Static HTML — the
  // mtime baseline is captured at click time, not page-render time, so
  // it's always accurate.
  // In demo mode the watch list is a frozen synthetic snapshot — the
  // refresh button has nothing to refresh against, so we omit it.
  // When circuit is OPEN, render the button red + disabled with a countdown
  // tooltip. Server-side already bails the scan out — this just removes the
  // temptation to click and the visual ambiguity.
  const refreshBtnHtml = data.demo_mode ? "" : (circuitOpen ? `
    <button type="button" class="wl-refresh-btn circuit-open" id="wlRefreshBtn"
            disabled aria-label="Refresh watch list (disabled — circuit OPEN)"
            title="Open-Meteo circuit breaker is OPEN. Refresh disabled for ~${circuitOpenRemainMin} min so clicks don't reset the cooldown. Last-good watch list is preserved.">↻</button>
    <span class="wl-refresh-status" id="wlRefreshStatus"></span>` : `
    <button type="button" class="wl-refresh-btn" id="wlRefreshBtn"
            title="Re-scan the watch list" aria-label="Refresh watch list"
            onclick="refreshWatchList(this)">↻</button>
    <span class="wl-refresh-status" id="wlRefreshStatus"></span>`);
  if (!w.ok) {
    return `<div class="card" style="grid-column: span 2;">
      <div class="card-title">Watch List ${refreshBtnHtml}</div>
      <div class="sub-stat neg">⚠ Couldn't load watch list: ${escapeHtml(w.error || "")}</div>
      <div class="help">Tap <strong>↻ Refresh</strong> above to run a scan and populate the cache, or run <code>main.py</code> from the terminal.</div>
    </div>`;
  }
  const candidates = w.candidates || [];
  // Build the freshness line — "scanned X min ago, cached" or "just scanned"
  const ageMin = w.age_seconds != null ? Math.round(w.age_seconds / 60) : null;
  const freshLabel = ageMin == null ? "" :
    (ageMin === 0 ? "scanned just now" :
     ageMin === 1 ? "scanned 1 min ago" :
     `scanned ${ageMin} min ago`);
  const cacheNote = w.from_cache ? ` <span class="muted">(from cache — re-run <code>main.py</code> to refresh)</span>` : "";

  // Open-Meteo silent-failure UX (2026-05-12 ship — closes 5/5 dashboard
  // incident #2 silent-failure gap). When the circuit breaker is OPEN on any
  // upstream host, the scan can return 0 candidates not because no edges
  // exist but because model fetches were short-circuited. Without a badge,
  // the empty-list state renders identically to "no edges" — operator can
  // react two wrong ways (keep clicking refresh, or trust the empty result).
  // Render a small status pill in the card title that surfaces the breaker
  // state explicitly. (circuit / openHosts / halfOpenHosts / circuitOpen
  // are computed at the top of renderWatchList so the Refresh button can
  // react to OPEN state too — see 2026-05-20 deepening fix.)
  let healthBadge = "";
  if (circuitOpen) {
    // Refresh button is already red+disabled with a countdown — keep the
    // badge as the prose explanation. Mention "click is now a no-op" since
    // the deepening hole is closed as of 2026-05-20.
    const hostList = openHosts.map(([h]) => escapeHtml(h)).join(", ");
    healthBadge = `<span class="card-badge" style="background:#f8d4d4;color:#8a2d2d;margin-left:8px;" title="Open-Meteo circuit breaker is OPEN on: ${hostList}. Refresh is disabled until cooldown clears (~${circuitOpenRemainMin} min) so clicks don't reset the timer. Last-good watch list is preserved.">⚠ Circuit OPEN · ~${circuitOpenRemainMin} min cooldown</span>`;
  } else if (halfOpenHosts.length > 0) {
    healthBadge = `<span class="card-badge" style="background:#ffe6c2;color:#8a4d00;margin-left:8px;" title="Open-Meteo circuit is in HALF-OPEN probe state — one in-flight request will determine whether it closes.">Circuit probing</span>`;
  } else if (degradedHosts.length > 0) {
    // A non-critical forecast leg (e.g. NWS / api.weather.gov) is OPEN or
    // probing. The blend is running on the remaining models and the scan is
    // still valid, so this is informational only — Refresh stays enabled.
    // (2026-06-02 card #22.)
    const dh = degradedHosts.map(([h]) => escapeHtml(h)).join(", ");
    healthBadge = `<span class="card-badge" style="background:#ffe6c2;color:#8a4d00;margin-left:8px;" title="A non-critical forecast leg's circuit is tripped (${dh}). The blend dropped that model but is still running on the others — the scan and its edges are valid. Refresh stays enabled.">⚠ NWS leg degraded</span>`;
  } else if (Object.keys(circuit).length > 0) {
    // All known hosts CLOSED — model fetches are healthy.
    healthBadge = `<span class="card-badge" style="background:#d4edda;color:#2d6a3a;margin-left:8px;" title="Every tracked forecast host's circuit breaker is closed — model fetches are healthy.">Healthy</span>`;
  }
  // No-badge case: circuit_state is empty (legacy cache pre-2026-05-12 ship,
  // or breaker never tracked any host). Stay quiet rather than render an
  // ambiguous "no data" pill — it'd confuse more than it clarifies.

  if (candidates.length === 0) {
    // When the circuit is OPEN and we have zero candidates, the empty-state
    // copy needs to distinguish "no edges" from "no model data." The badge
    // already says which one, but the explanation copy should match.
    const emptyReason = circuitOpen
      ? "Open-Meteo's circuit breaker is short-circuiting model fetches, so this scan has no model probabilities to compare against the market. Refresh is disabled until the cooldown clears so clicks don't reset the timer."
      : "No possible trades cleared the bot's filters this scan. Either market prices have caught up to the model, or no markets in the window meet the bot's edge threshold.";
    return `<div class="card" style="grid-column: span 2;">
      <div class="card-title">Watch List ${refreshBtnHtml}${healthBadge}</div>
      <div class="empty">${emptyReason}</div>
      <div class="help">${escapeHtml(freshLabel)}${cacheNote}.</div>
    </div>`;
  }

  // Expected $ P&L preview is computed at the bot's per-trade dollar cap
  // (per-trade cap). It's just a forecast, not a
  // promise — actual contract count is floored to whole contracts and may
  // be further trimmed by Kelly / per-city / per-date caps. Hardcoded
  // here because the watch_list payload doesn't surface the env value;
  // bump if the per-trade cap changes.
  const PNL_PREVIEW_USD = 10.0;
  const rows = candidates.map(c => {
    const sideCls = c.side === "yes" ? "pos" : "neg";
    const edgeCls = c.edge > 0 ? "pos" : "neg";
    const edgePct = `${c.edge >= 0 ? "+" : ""}${(c.edge * 100).toFixed(1)}%`;
    const ourP = `${(c.our_prob * 100).toFixed(0)}%`;
    const mktP = `${(c.market_prob * 100).toFixed(0)}%`;
    // Per-contract cost (in dollars, 0..1) — side-aware. Pulled from the
    // book's far-side quote when available, falling back to market_prob.
    // Used for Entry, Cost, and Exp. P&L so all three columns agree.
    // Note: maker pricing would shave another ~1¢ off in our favor; we keep
    // the taker-side quote here for a conservative preview, matching what
    // Open Trades would show if we filled at the ask.
    let perContractCost;
    if (c.side === "yes") {
      perContractCost = (c.yes_ask != null) ? c.yes_ask : c.market_prob;
    } else {
      perContractCost = (c.yes_bid != null) ? (1 - c.yes_bid) : (1 - c.market_prob);
    }
    // Entry = per-contract cost in cents (mirrors Open Trades' Entry column).
    const entryStr = (perContractCost != null && perContractCost > 0)
      ? `${Math.round(perContractCost * 100)}¢`
      : "—";
    // Cost = projected $ for the actual trade size after the whole-contract
    // floor (mirrors Open Trades' Cost). per-trade-capped — Kelly /
    // per-city / per-date caps may trim it further at place-order time.
    let projectedCost = null;
    let nContracts = 0;
    if (perContractCost != null && perContractCost > 0) {
      nContracts = Math.floor(PNL_PREVIEW_USD / perContractCost);
      projectedCost = nContracts * perContractCost;
    }
    const costStr = projectedCost != null ? fmtUSD(projectedCost) : "—";
    // Expected P&L for a hypothetical PNL_PREVIEW_USD trade at the
    // counterparty side's best quote. Win probability is side-relative.
    let expectedPnl = null;
    if (perContractCost != null && perContractCost > 0) {
      const winProbForPnl = c.side === "yes" ? c.our_prob : (1 - c.our_prob);
      expectedPnl = PNL_PREVIEW_USD * (winProbForPnl - perContractCost) / perContractCost;
    }
    const pnlCls = expectedPnl == null ? "" : (expectedPnl >= 0 ? "pos" : "neg");
    const pnlStr = expectedPnl == null
      ? "—"
      : `${expectedPnl >= 0 ? "+" : ""}$${expectedPnl.toFixed(2)}`;
    // Side-relative win probability — our model's probability that THE BET
    // (not the YES outcome) pays out. For YES bets, that's our_prob; for NO
    // bets, it's 1 - our_prob. The existing Our/Mkt Prob columns both refer
    // to the YES outcome (Kalshi convention), which means the user has to
    // mentally invert them when reading a NO row. This collapses that
    // inversion into one number.
    const winProb = c.side === "yes" ? c.our_prob : (1 - c.our_prob);
    const winP = `${(winProb * 100).toFixed(0)}%`;
    // Bot Win % delta vs. previous scan. _dashboard_data.watch_list() attaches
    // c.prev_our_prob (YES-outcome probability) when a (ticker, side) match
    // exists in the prior cache. Compare the *displayed* (rounded-to-int-%)
    // values rather than raw probabilities — that way we only color when the
    // visible number actually moved, avoiding noisy flashes on sub-percent
    // wiggles. Green = went up, red = went down, neutral = unchanged or new.
    let winCls = "";
    if (c.prev_our_prob != null) {
      const prevWinProb = c.side === "yes" ? c.prev_our_prob : (1 - c.prev_our_prob);
      const prevDisp = Math.round(prevWinProb * 100);
      const curDisp = Math.round(winProb * 100);
      const delta = curDisp - prevDisp;
      if (delta > 0) winCls = "pos";
      else if (delta < 0) winCls = "neg";
    }
    // Build the side-aware win-prob history for the tooltip.
    // c.history is a list of {ts, our_prob, market_prob, edge} written by
    // _watch_list_history.append_history() and capped at HISTORY_MAX_PER_KEY
    // per (ticker, side). We DON'T splice in the current scan row at the
    // end — the current scan was already appended to history by the same
    // refresh that wrote the cache, so it shows up as the last sample
    // already.
    const historyRaw = Array.isArray(c.history) ? c.history : [];
    const winTitle = buildHistoryTooltip(
      `Bot Win % over time (${historyRaw.length} scan${historyRaw.length === 1 ? "" : "s"}, side-relative):`,
      historyRaw,
      r => c.side === "yes" ? r.our_prob : (1 - r.our_prob),
      v => v == null ? "—" : `${(v * 100).toFixed(0)}%`,
    );
    // Kalshi Win % — market-implied probability that THE BET pays out.
    // Same number Kalshi shows on each open bet in their app. For YES bets
    // that's market_prob (the YES mid); for NO bets it's 1 - market_prob.
    // Color semantics mirror the existing Mkt Prob delta logic on the Edge
    // tooltip: green when the market moved in our favor (i.e. when this
    // cell's value went UP, meaning Kalshi is now pricing our bet as more
    // likely to win), red when it moved against us. The gap between this
    // column and "Bot Win %" is the bot's edge in win-probability units —
    // larger gap = bot disagrees with market more strongly.
    const kalshiWinProb = c.market_prob != null
      ? (c.side === "yes" ? c.market_prob : (1 - c.market_prob))
      : null;
    const kalshiWinP = kalshiWinProb != null ? `${(kalshiWinProb * 100).toFixed(0)}%` : "—";
    let kalshiWinCls = "";
    if (c.prev_market_prob != null && kalshiWinProb != null) {
      const prevKalshiWinProb = c.side === "yes" ? c.prev_market_prob : (1 - c.prev_market_prob);
      const prevDisp = Math.round(prevKalshiWinProb * 100);
      const curDisp = Math.round(kalshiWinProb * 100);
      const delta = curDisp - prevDisp;
      if (delta > 0) kalshiWinCls = "pos";
      else if (delta < 0) kalshiWinCls = "neg";
    }
    const kalshiWinTitle = historyRaw.length === 0
      ? "No prior scans recorded for this ticker"
      : buildHistoryTooltip(
          `Kalshi Win % over time (${historyRaw.length} scan${historyRaw.length === 1 ? "" : "s"}, market-implied):`,
          historyRaw,
          r => r.market_prob == null ? null : (c.side === "yes" ? r.market_prob : (1 - r.market_prob)),
          v => v == null ? "—" : `${(v * 100).toFixed(0)}%`,
        );
    // Mkt Prob delta — colored from OUR perspective, not absolute direction.
    // For a YES bet, lower market_prob is better (cheaper to buy YES).
    // For a NO bet, higher market_prob is better (cheaper to buy NO since
    // NO cost = 1 - market_prob). This keeps the column's color semantics
    // consistent with Win % and Edge: green always means "moved in our favor".
    let mktCls = "";
    let mktTitle = "";
    if (c.prev_market_prob != null) {
      const prevMktDisp = Math.round(c.prev_market_prob * 100);
      const curMktDisp = Math.round(c.market_prob * 100);
      const rawDelta = curMktDisp - prevMktDisp;
      // Sign-flip for YES side so that "favorable to us" is always positive.
      const favorableDelta = c.side === "yes" ? -rawDelta : rawDelta;
      if (favorableDelta > 0) mktCls = "pos";
      else if (favorableDelta < 0) mktCls = "neg";
      const arrow = rawDelta > 0 ? "▲" : rawDelta < 0 ? "▼" : "·";
      const sign = rawDelta > 0 ? "+" : "";
      const dirNote = favorableDelta > 0 ? " (favorable)" : favorableDelta < 0 ? " (against us)" : "";
      mktTitle = `Last scan: ${prevMktDisp}% (${arrow} ${sign}${rawDelta} pp${dirNote})`;
    } else {
      mktTitle = "No prior scan to compare against";
    }
    // Edge delta — already signed (positive = favorable bet). Higher edge =
    // green, lower = red. This will often correlate with Win % and Mkt Prob
    // deltas, but it's a useful summary because edge captures both at once.
    let edgeDeltaCls = edgeCls;
    if (c.prev_edge != null) {
      // Compare raw edge values (4 decimals from cache) for tooltip precision,
      // but color on the displayed pp value to stay consistent with the Win%
      // and Mkt% logic — only color when the *visible* number changed.
      const prevEdgeDisp = (c.prev_edge * 100).toFixed(1);
      const curEdgeDisp = (c.edge * 100).toFixed(1);
      const deltaPp = parseFloat(curEdgeDisp) - parseFloat(prevEdgeDisp);
      // Override the static edgeCls (sign-of-edge) with delta-of-edge when
      // we have a prior scan: this matches the color semantics of the other
      // two delta columns. Edge sign is still legible from the +/- in the
      // value itself, so we don't lose information.
      if (deltaPp > 0) edgeDeltaCls = "pos";
      else if (deltaPp < 0) edgeDeltaCls = "neg";
      else edgeDeltaCls = "";
    }
    // Edge history → multi-row tooltip. We also inline the mkt-prob trail
    // in the tooltip text since the Watch List has no dedicated Mkt Prob
    // column (it's folded into this cell's tooltip). That gives Aaron
    // variance over time on the full bet thesis: model's win % (Win % cell),
    // edge (this cell), and the market price the edge was computed against.
    // Tooltip: header line, then per-scan rows with edge + mkt prob inline.
    let edgeTitle;
    if (historyRaw.length === 0) {
      edgeTitle = `No prior scans recorded yet | Our prob: ${ourP} · Mkt prob: ${mktP}`;
    } else {
      const headerLine = `Edge over time (${historyRaw.length} scan${historyRaw.length === 1 ? "" : "s"}; mkt prob in parens):`;
      const tooltipBody = buildHistoryTooltip(
        headerLine,
        historyRaw,
        r => r,
        r => {
          const e = r.edge;
          const mp = r.market_prob;
          const eStr = e == null ? "—" : `${e >= 0 ? "+" : ""}${(e * 100).toFixed(1)}%`;
          const mpStr = mp == null ? "—" : `${(mp * 100).toFixed(0)}%`;
          return `${eStr}  (mkt ${mpStr})`;
        },
      );
      edgeTitle = `${tooltipBody}\n\nNow: Our prob ${ourP} · Mkt prob ${mktP}`;
    }
    // Verdict cell precedence:
    //   1. placed_status set       → green "placed"/"filled" pill (Telegram-
    //      approved trade already in pnl.sqlite for this ticker+side, so the
    //      click-to-trade button would just duplicate the order)
    //   2. is_locked               → flat warn pill, NO click affordance per
    //      the LOCKED-bypass-distrust rule (memory: never bypass risk caps
    //      on is_locked opportunities; an early-pilot loss from a stale observation
    //      observations that disagreed with Kalshi settlement)
    //   3. otherwise               → click-to-trade button + status span
    let verdict;
    if (c.placed_status) {
      const label = c.placed_status === "filled" ? "filled" : "placed";
      verdict = `<span class="pill pill-good">${label}</span>`;
    } else if (c.is_locked) {
      verdict = `<span class="pill pill-warn">locked</span>`;
    } else if (data.demo_mode) {
      // No click-to-trade button in the demo — the synthetic candidates
      // wouldn't lead anywhere even if it were wired. A muted pill
      // matches the visual rhythm of the other Verdict cells without
      // implying interactivity.
      verdict = `<span class="pill pill-unknown">would trade</span>`;
    } else {
      // Single button per row; its label, class, and behavior are driven
      // by the trade-mode toggle in the card title. The button renders
      // with the current mode (read from getTradeMode()) so it's correct
      // from first paint, and setTradeMode() rewrites the class/label on
      // every visible js-trade-btn whenever the toggle flips.
      const mode = (typeof getTradeMode === "function") ? getTradeMode() : "telegram";
      const isDirect = mode === "direct";
      const btnCls = isDirect ? "pill-action-direct" : "pill-action";
      const btnTxt = isDirect ? "place directly →" : "via Telegram →";
      const btnTitle = isDirect
        ? "BYPASSES Telegram approval. Launches a scan, places the order immediately if it passes the risk re-check. JS confirm() before fire."
        : "Launches a scan, then sends a Telegram approval prompt before placing the order";
      verdict = `<span class="verdict-cell">
           <button type="button" class="pill ${btnCls} js-trade-btn"
                   data-ticker="${escapeHtml(c.ticker)}"
                   data-side="${escapeHtml(c.side)}"
                   data-our-prob="${(c.our_prob * 100).toFixed(0)}"
                   data-market-prob="${(c.market_prob * 100).toFixed(0)}"
                   title="${escapeHtml(btnTitle)}"
                   onclick="executeTrade(this)">${btnTxt}</button>
           <span class="trade-status" data-ticker="${escapeHtml(c.ticker)}"></span>
         </span>`;
    }
    const desc = c.bracket_description || c.ticker;
    // data-sort-* attrs power applyWatchListSort(). Raw numeric values are
    // emitted so JS can parseFloat() without re-deriving from the formatted
    // cell text. Nulls are emitted as empty strings; applyWatchListSort
    // treats empty as "always bottom" regardless of direction.
    return `<tr
       data-sort-ticker="${escapeHtml(c.ticker || "")}"
       data-sort-entry="${perContractCost != null ? perContractCost : ""}"
       data-sort-cost="${projectedCost != null ? projectedCost : ""}"
       data-sort-botwin="${winProb != null ? winProb : ""}"
       data-sort-kalshiwin="${kalshiWinProb != null ? kalshiWinProb : ""}"
       data-sort-edge="${c.edge != null ? c.edge : ""}"
       data-sort-pnl="${expectedPnl != null ? expectedPnl : ""}">
      <td class="mono">${escapeHtml(c.ticker)}</td>
      <td><span class="muted" style="font-size: 11px;">${escapeHtml(desc)}</span></td>
      <td class="${sideCls}" style="font-weight: 600;">${escapeHtml(c.side.toUpperCase())}${nContracts > 0 ? ` ${nContracts}` : ""}</td>
      <td class="numeric mono muted">${entryStr}</td>
      <td class="numeric">${costStr}</td>
      <td class="numeric mono ${winCls}" style="font-weight: 600; cursor: help;" title="${escapeHtml(winTitle)}">${winP}</td>
      <td class="mono ${kalshiWinCls}" style="font-weight: 600; cursor: help;" title="${escapeHtml(kalshiWinTitle)}">${kalshiWinP}</td>
      <td class="numeric mono ${edgeDeltaCls}" style="font-weight: 600; cursor: help;" title="${escapeHtml(edgeTitle)}">${edgePct}</td>
      <td class="numeric mono ${pnlCls}" style="font-weight: 600;">${pnlStr}</td>
      <td>${verdict}</td>
    </tr>`;
  }).join("");

  return `
    <div class="card" style="grid-column: span 2;">
      <div class="card-title">${data.demo_mode ? "" : `<span class="trade-mode-toggle" role="radiogroup" aria-label="Trade mode">
            <button type="button" class="mode-pill mode-pill-active" data-mode="direct"
                    aria-pressed="true"
                    onclick="setTradeMode('direct')"
                    title="Place orders directly from the dashboard — no Telegram approval. JS confirm() still fires per click. (Default.)">place directly</button><button type="button" class="mode-pill" data-mode="telegram"
                    onclick="setTradeMode('telegram')"
                    title="Each click sends a Telegram approval prompt before any order is placed.">via Telegram</button>
         </span>`}Watch List (${candidates.length} possible trade${candidates.length === 1 ? "" : "s"}) ${refreshBtnHtml}${healthBadge}</div>
      <div class="scrollable">
        <table>
          <thead><tr>
            <th class="wl-sortable" data-sort-key="ticker" onclick="handleWatchListSortClick(this)">Ticker<span class="wl-sort-arrow"></span></th>
            <th>Bucket</th>
            <th>Side × Qty</th>
            <th class="numeric wl-sortable" data-sort-key="entry" onclick="handleWatchListSortClick(this)">Entry<span class="wl-sort-arrow"></span></th>
            <th class="numeric wl-sortable" data-sort-key="cost" onclick="handleWatchListSortClick(this)">Cost<span class="wl-sort-arrow"></span></th>
            <th class="numeric wl-sortable" data-sort-key="botwin" onclick="handleWatchListSortClick(this)">Bot Win %<span class="wl-sort-arrow"></span></th>
            <th class="wl-sortable" data-sort-key="kalshiwin" onclick="handleWatchListSortClick(this)">Kalshi Win %<span class="wl-sort-arrow"></span></th>
            <th class="numeric wl-sortable" data-sort-key="edge" onclick="handleWatchListSortClick(this)">Edge<span class="wl-sort-arrow"></span></th>
            <th class="numeric wl-sortable" data-sort-key="pnl" onclick="handleWatchListSortClick(this)">Exp. P&amp;L<span class="wl-sort-arrow"></span></th>
            <th>Verdict</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="help">${data.demo_mode ? `Synthetic candidates. Default sort: highest Exp. P&amp;L first — click any column header to re-sort. ${escapeHtml(freshLabel)}${cacheNote}. <strong>Entry</strong> = per-contract cost in cents. <strong>Cost</strong> = projected $ on a fill. <strong>Bot Win %</strong> = our model's probability the bet pays out. <strong>Kalshi Win %</strong> = market-implied probability (the same number shown on Kalshi's open-bet rows). The gap between the two is the bot's edge in probability units. <strong>Edge</strong> is color-coded vs. the last scan. Click-to-trade is disabled in this preview.` : `Live model output. Each row passed every filter in the bot's strategy module (the bot's filter set). Default sort: highest Exp. P&amp;L first — click any column header to re-sort (Ticker, Entry, Cost, Bot Win %, Kalshi Win %, Edge, Exp. P&amp;L). Your sort choice persists across refreshes. ${escapeHtml(freshLabel)}${cacheNote}. <strong>Entry</strong> = per-contract cost in cents (side-aware: YES ask, or 1 − YES bid for NO). <strong>Cost</strong> = projected $ at the $5 max-trade preview after the whole-contract floor; mirrors what would land in Open Trades on a fill. <strong>Bot Win %</strong> = our model's probability that THE BET pays out (side-relative). <strong>Kalshi Win %</strong> = market-implied probability of the same outcome — the number Kalshi displays on each open position. The gap between these two columns is the bot's edge in win-probability units; <strong>Edge</strong> is the same gap restated as YES-mid vs. our_prob. All three columns are color-coded vs. the last scan: <span class="pos">green</span> = moved in our favor, <span class="neg">red</span> = moved against us (hover any cell for the prior value and delta). Hover the Edge cell to see the underlying Our Prob / Mkt Prob breakdown. <strong>Exp. P&amp;L</strong> previews the expected dollar profit on the projected trade size — Kelly + per-city/per-date caps may trim it further in practice. The toggle at the top-left of this card switches every row's button between two modes. <strong>place directly →</strong> (default) places the order as soon as the scan + risk re-check pass — no Telegram round-trip. <strong>via Telegram →</strong> routes the order through the standard Telegram approval prompt. A JS confirm() pops before any click fires either way. Locked rows stay non-clickable.`}</div>
    </div>`;
}

function renderRestingOrders(data) {
  // Resting orders = limit orders the bot has placed but that haven't
  // filled yet. They're the bot's offers sitting on Kalshi's order book.
  // Useful to surface so we can see exactly what's currently being
  // quoted (and spot stale orders that should be cancelled and re-quoted).
  const r = data.resting_orders || {};
  if (!r.ok) {
    return `<div class="card"><div class="card-title">Resting orders</div>
      <div class="sub-stat neg">⚠ Couldn't reach Kalshi: ${escapeHtml(r.error || "")}</div></div>`;
  }
  const orders = r.orders || [];
  if (orders.length === 0) {
    // Hide the card entirely when there's nothing on the book — Aaron asked
    // 2026-05-02 to stop showing it in the empty state. The Kalshi-unreachable
    // branch above still renders so we don't silently mask API failures.
    return "";
  }
  const ageString = (iso) => {
    if (!iso) return "—";
    const t = new Date(iso).getTime();
    if (Number.isNaN(t)) return "—";
    const mins = Math.floor((Date.now() - t) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m";
    return Math.floor(mins / 60) + "h " + (mins % 60) + "m";
  };
  const rows = orders.map(o => {
    const sideCls = o.side === "yes" ? "pos" : "neg";
    const action = (o.action || "").toUpperCase();
    const price = o.price_cents != null ? `${o.price_cents}¢` : "—";
    const remaining = o.remaining_count != null ? o.remaining_count : (o.count ?? "—");
    return `<tr>
      <td class="mono">${escapeHtml(o.ticker || "")}</td>
      <td class="${sideCls}">${escapeHtml(action)} ${escapeHtml(String(o.side || "").toUpperCase())}</td>
      <td class="numeric">${remaining}</td>
      <td class="numeric mono">${price}</td>
      <td class="muted" style="font-size: 11px;">${escapeHtml(ageString(o.created_time))}</td>
    </tr>`;
  }).join("");
  return `
    <div class="card" style="grid-column: span 2;">
      <div class="card-title">Resting orders (${orders.length})</div>
      <table>
        <thead><tr>
          <th>Ticker</th>
          <th>Action × Side</th>
          <th class="numeric">Remaining</th>
          <th class="numeric">Price</th>
          <th>Age</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="help">Limit orders the bot has on Kalshi's book waiting to fill. Maker-priced limit orders avoid crossing the spread and paying taker fees. An order sitting longer than the market's expected fill time is a candidate to cancel and re-quote at a fresher level.</div>
    </div>`;
}

function renderCalibration(data) {
  // Reliability plot — for each predicted-probability decile, plot
  // (predicted, observed) vs the y=x diagonal. Diagonal = perfectly
  // calibrated. Below = overconfident, above = underconfident. Bubble size
  // ∝ √N so high-N buckets visually carry more weight without dominating.
  const c = data.calibration || {};
  const buckets = c.buckets || [];
  if (buckets.length < 2) {
    return `<div class="card">
      <div class="card-title">Calibration reliability</div>
      <div class="empty">Need at least 2 settled probability buckets to draw a calibration plot. (N=${c.n_total ?? 0} settled so far.)</div>
    </div>`;
  }
  const W = 580, H = 320, pad = { l: 50, r: 16, t: 14, b: 40 };
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;
  // X-axis is zoomed to [xMin, xMax] (defaults [0.7, 1.0]) because the bot's
  // entry filters mean P(our side wins) is essentially
  // never below ~0.7 in production. xMin/xMax come from calibration_data so
  // the Python and JS sides stay in sync.
  const xMin = (c.x_min != null) ? c.x_min : 0.7;
  const xMax = (c.x_max != null) ? c.x_max : 1.0;
  const xOf = (p) => pad.l + ((p - xMin) / (xMax - xMin)) * innerW;
  const yOf = (p) => pad.t + (1 - p) * innerH;

  // y=x diagonal — the calibration target. Drawn from (xMin, xMin) to
  // (xMax, xMax) so it still represents perfect calibration over the
  // visible window.
  const diag = `<line x1="${xOf(xMin)}" y1="${yOf(xMin)}" x2="${xOf(xMax)}" y2="${yOf(xMax)}" stroke="var(--chart-axis)" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5,4" />`;

  // X gridlines at every interior bucket boundary; Y gridlines at 0.25 /
  // 0.5 / 0.75 stay as before so we still see how far an extreme bubble
  // (e.g., predicted 90% / observed 30%) lands from the diagonal.
  const xGridTicks = [0.75, 0.80, 0.85, 0.90, 0.95];
  const yGridTicks = [0.25, 0.5, 0.75];
  const grid = [
    ...xGridTicks.map(v => `<line x1="${xOf(v)}" y1="${pad.t}" x2="${xOf(v)}" y2="${pad.t + innerH}" stroke="var(--chart-grid)" stroke-width="1" />`),
    ...yGridTicks.map(v => `<line x1="${pad.l}" y1="${yOf(v)}" x2="${pad.l + innerW}" y2="${yOf(v)}" stroke="var(--chart-grid)" stroke-width="1" />`),
  ].join("");

  // Axis labels — themed via CSS var. X labels at every other bucket
  // boundary (70/80/90/100) to keep the axis legible.
  const xLabels = [0.70, 0.80, 0.90, 1.00].map(v =>
    `<text x="${xOf(v)}" y="${pad.t + innerH + 16}" text-anchor="middle" font-size="10" fill="var(--chart-axis)">${(v * 100).toFixed(0)}%</text>`
  ).join("");
  const yLabels = [0, 0.25, 0.5, 0.75, 1].map(v =>
    `<text x="${pad.l - 6}" y="${yOf(v) + 4}" text-anchor="end" font-size="10" fill="var(--chart-axis)">${(v * 100).toFixed(0)}%</text>`
  ).join("");
  const xTitleText = `Predicted probability (${(xMin * 100).toFixed(0)}–${(xMax * 100).toFixed(0)}%)`;
  const xTitle = `<text x="${pad.l + innerW / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--chart-axis)" font-weight="600">${xTitleText}</text>`;
  const yTitle = `<text x="14" y="${pad.t + innerH / 2}" text-anchor="middle" font-size="11" fill="var(--chart-axis)" font-weight="600" transform="rotate(-90 14 ${pad.t + innerH / 2})">Observed win rate</text>`;

  // Bubbles. Radius √N scaled so a bucket with 1 trade is ~5px and a 30-trade
  // bucket is ~14px — keeps the highest-N bucket visually dominant without
  // letting it eat the chart.
  const maxN = Math.max(...buckets.map(b => b.n));
  const rOf = (n) => 4 + Math.sqrt(n / Math.max(1, maxN)) * 11;
  const dots = buckets.map(b => {
    const cx = xOf(b.predicted_mean);
    const cy = yOf(b.observed_rate);
    const r = rOf(b.n);
    // Color: green when bucket is at-or-above diagonal (well-calibrated or
    // underconfident — both fine), red when below (overconfident — bad).
    const onOrAbove = b.observed_rate >= b.predicted_mean - 0.02;
    const fill = onOrAbove ? "var(--pos-color)" : "var(--neg-color)";
    return `<circle class="cal-dot" cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" fill-opacity="0.55" stroke="${fill}" stroke-width="1.5"
      data-pred="${b.predicted_mean}" data-obs="${b.observed_rate}" data-n="${b.n}" data-won="${b.won}" data-range="${(b.lo*100).toFixed(0)}-${(b.hi*100).toFixed(0)}"
      onmouseenter="showCalTip(this)" onmouseleave="hideCalTip()" />`;
  }).join("");

  const brierStr = c.brier != null ? ` &middot; Brier ${c.brier}` : "";
  const belowMin = c.n_below_min || 0;
  const belowNote = belowMin > 0
    ? ` <span class="muted">(${belowMin} trade${belowMin === 1 ? "" : "s"} below ${(xMin * 100).toFixed(0)}% predicted not shown — they still count toward Brier.)</span>`
    : "";
  return `
    <div class="card" style="grid-column: span 2; position: relative;">
      <div class="card-title">Calibration reliability  (N=${c.n_total}${brierStr})</div>
      <svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="display:block;">
        ${grid}
        ${diag}
        ${xLabels}
        ${yLabels}
        ${xTitle}
        ${yTitle}
        ${dots}
      </svg>
      <div class="chart-tip" id="cal-tip"></div>
      <div class="help">Each bubble = one 5%-wide bucket of predicted probability, zoomed into the [${(xMin * 100).toFixed(0)}–${(xMax * 100).toFixed(0)}%] window where the bot's entry filters mean every settled trade actually lands. Bubble size ∝ √N. Dashed line = perfect calibration. Bubbles BELOW = overconfident in that range; ABOVE = underconfident. With low N these wander; the structure is what tells the story.${belowNote}</div>
    </div>`;
}

function renderPnLChart(data) {
  const series = data.cumulative_pnl_series || [];
  if (series.length < 2) {
    return `<div class="card"><div class="card-title">Cumulative P&amp;L</div><div class="empty">Need at least 2 settled trades to draw a chart.</div></div>`;
  }
  // Inline SVG line chart — no Chart.js needed for ~10-100 data points.
  const W = 580, H = 200, pad = { l: 50, r: 16, t: 14, b: 28 };
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;
  const cums = series.map(s => s.cumulative_usd);
  const yMin = Math.min(0, ...cums);
  const yMax = Math.max(0, ...cums);
  const yPad = (yMax - yMin) * 0.1 || 1;
  const yLo = yMin - yPad, yHi = yMax + yPad;
  const xOf = (i) => pad.l + (series.length === 1 ? 0 : (i / (series.length - 1)) * innerW);
  const yOf = (v) => pad.t + ((yHi - v) / (yHi - yLo)) * innerH;
  // Per-segment coloring: the line from day i-1's dot to day i's dot rises or
  // falls by day i's net P&L, so color each segment by that day's result —
  // green if the bot broke even or better that day (pnl_usd >= 0), red if it
  // lost money. This replaces the old single-color polyline (one color for the
  // whole line based on the final cumulative).
  const segments = series.slice(1).map((s, idx) => {
    const i = idx + 1;
    const segColor = (s.pnl_usd || 0) >= 0 ? "var(--pos-color)" : "var(--neg-color)";
    return `<line x1="${xOf(i - 1)}" y1="${yOf(series[i - 1].cumulative_usd)}" x2="${xOf(i)}" y2="${yOf(s.cumulative_usd)}" stroke="${segColor}" stroke-width="2" stroke-linecap="round" />`;
  }).join("");
  // Each dot carries its own data via dataset attributes so the global
  // showPnlTip() handler can read them on mouseenter without us needing
  // to maintain a parallel JS array. Each dot now represents one full
  // settlement day (n_trades trades), not a single trade — the tooltip
  // shows the day's combined P&L plus the running total.
  const dots = series.map((s, i) => {
    const dateAttr = escapeHtml((s.settle_ts || "").slice(0, 10));
    const fill = s.cumulative_usd >= 0 ? "var(--pos-color)" : "var(--neg-color)";
    return `<circle class="pnl-dot" cx="${xOf(i)}" cy="${yOf(s.cumulative_usd)}" r="3.5" fill="${fill}" data-date="${dateAttr}" data-cum="${s.cumulative_usd}" data-pnl="${s.pnl_usd}" data-trades="${s.n_trades || 1}" data-wins="${s.wins || 0}" onmouseenter="showPnlTip(this)" onmouseleave="hidePnlTip()" />`;
  }).join("");
  // Y-axis labels — fill via CSS var so they invert correctly in dark mode
  const yLabels = [yLo, (yLo + yHi) / 2, yHi].map(v =>
    `<text x="${pad.l - 6}" y="${yOf(v) + 4}" text-anchor="end" font-size="10" fill="var(--chart-axis)">${fmtUSD(v, true)}</text>`
  ).join("");
  // Zero baseline
  const zeroLine = (yLo < 0 && yHi > 0)
    ? `<line x1="${pad.l}" y1="${yOf(0)}" x2="${pad.l + innerW}" y2="${yOf(0)}" stroke="var(--chart-zero)" stroke-dasharray="3,3" />`
    : "";
  // X-axis labels: first/middle/last
  const dateLabel = (s) => (s?.settle_ts || "").slice(5, 10);
  const xLabels = [
    `<text x="${pad.l}" y="${H - 8}" font-size="10" fill="var(--chart-axis)">${escapeHtml(dateLabel(series[0]))}</text>`,
    `<text x="${pad.l + innerW / 2}" y="${H - 8}" font-size="10" fill="var(--chart-axis)" text-anchor="middle">${escapeHtml(dateLabel(series[Math.floor(series.length / 2)]))}</text>`,
    `<text x="${pad.l + innerW}" y="${H - 8}" font-size="10" fill="var(--chart-axis)" text-anchor="end">${escapeHtml(dateLabel(series[series.length - 1]))}</text>`,
  ].join("");
  // Lifetime WR badge in the card title — sums wins / trades across every
  // settled day in the series so the at-a-glance number on the card matches
  // what the per-day tooltip aggregates to.
  const totalTrades = series.reduce((acc, s) => acc + (s.n_trades || 0), 0);
  const totalWins = series.reduce((acc, s) => acc + (s.wins || 0), 0);
  const wrPct = totalTrades > 0 ? (totalWins / totalTrades) * 100 : 0;
  const wrCls = wrPct >= 50 ? "pos" : "neg";
  const wrBadge = totalTrades > 0
    ? ` &middot; <span class="${wrCls}">${wrPct.toFixed(0)}%</span> <span class="muted" style="font-weight: 400;">WR (${totalWins}/${totalTrades})</span>`
    : "";
  return `
    <div class="card" style="grid-column: span 2; position: relative;">
      <div class="card-title">Cumulative realized P&amp;L  (${series.length} day${series.length === 1 ? "" : "s"}${wrBadge})</div>
      <svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="display:block;">
        ${zeroLine}
        ${segments}
        ${dots}
        ${yLabels}
        ${xLabels}
      </svg>
      <div class="chart-tip" id="chart-tip"></div>
      <div class="help">Each dot = one settlement day (all trades that settled that day combined). Each line segment is colored by that day's result — <span class="pos">green</span> if the bot broke even or better, <span class="neg">red</span> if it lost money. Hover for the day's net P&amp;L, the trade count, and the running total.</div>
    </div>`;
}

function renderRoadmap(data) {
  const r = data.roadmap || {};
  const counts = r.counts || {shipped: 0, next: 0, later: 0};
  const fmtDate = (iso) => {
    if (!iso) return "";
    const d = new Date(iso + "T12:00:00Z");
    if (Number.isNaN(d.getTime())) return iso;
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  };
  const rowFor = (item, pill) => `<tr>
      <td style="white-space: nowrap; padding-right: 10px;">${pill}</td>
      <td style="line-height: 1.5;">${escapeHtml(item.title)}</td>
      <td class="numeric" style="white-space: nowrap; padding-left: 12px;">${item.date ? `<span class="muted" style="font-size: 10.5px;">${escapeHtml(fmtDate(item.date))}</span>` : ""}</td>
    </tr>`;
  const shippedRows = (r.shipped || []).map(i => rowFor(i, `<span class="pill pill-good" style="font-size: 9px;">✓</span>`)).join("");
  const nextRows = (r.next || []).map(i => rowFor(i, `<span class="pill pill-warn" style="font-size: 9px;">→</span>`)).join("");
  const laterRows = (r.later || []).map(i => rowFor(i, `<span class="pill pill-unknown" style="font-size: 9px;">○</span>`)).join("");
  const statTile = (n, label, cls, dim) => `
      <div style="text-align: center;">
        <div class="big-number ${cls}" style="font-size: 26px;${dim ? " opacity: 0.7;" : ""}">${n}</div>
        <div class="sub-stat">${label}</div>
      </div>`;
  const statRow = `
    <div class="kpi-row" style="margin-bottom: 14px;">
      ${statTile(counts.shipped, "Shipped", "pos", false)}
      ${statTile(counts.next, "Planned", "neutral", false)}
      ${statTile(counts.later, "Backlog", "neutral", true)}
    </div>`;
  const collapsibleList = (label, count, rowsHtml) => `
    <details class="roadmap-later">
      <summary class="roadmap-col-title" style="cursor: pointer;">${escapeHtml(label)} (${count}) · click to expand</summary>
      ${rowsHtml ? `<table class="roadmap-table" style="margin-top: 8px;"><tbody>${rowsHtml}</tbody></table>` : ""}
    </details>`;
  return `
    <div class="card" style="grid-column: span 2;">
      <div class="card-title">Shipping/Shipped (Roadmap)</div>
      ${statRow}
      <div class="roadmap-collapsibles">
        ${collapsibleList("Recently shipped", (r.shipped || []).length, shippedRows)}
        ${collapsibleList("Planned", (r.next || []).length, nextRows)}
        ${collapsibleList("Backlog", (r.later || []).length, laterRows)}
      </div>
      <div class="help" style="margin-top: 14px; text-align: center;">Illustrative items — the full roadmap is part of the private repo. Counts reflect the live project's scale.</div>
    </div>`;
}

function renderHealthBadge(data) {
  const h = data.bot_health || {};
  const v = h.verdict || "unknown";
  const ageH = h.age_hours;
  let label;
  if (v === "ok") label = "✓ healthy";
  else if (v === "stale") label = "⚠ stale";
  else if (v === "overdue") label = "⚠ overdue";
  else if (v === "error") label = "✗ error";
  else label = "—";
  const ageStr = ageH != null ? ` · last run ${ageString(h.last_run_ts)}` : "";
  return `<span class="pill pill-${v}">${label}${ageStr}</span>`;
}

function renderRecentTrades(data) {
  // "Closed trades" — settled wins/losses only. Open positions live in
  // the Active Book section, so this card avoids the duplication.
  const trades = data.recent_trades || [];
  if (trades.length === 0) return `<div class="card"><div class="card-title">Closed trades</div><div class="empty">No closed trades yet.</div></div>`;
  const rows = trades.map(t => {
    const stateClass = t.state === "won" ? "pill-won" : "pill-lost";
    const pnlCell = t.pnl_usd !== null && t.pnl_usd !== undefined
      ? `<td class="numeric ${pnlClass(t.pnl_usd)}">${fmtUSD(t.pnl_usd, true)}</td>`
      : '<td class="muted">—</td>';
    // "Total won/lost" = gross dollar impact of this trade. On a win it's
    // n_contracts × $1.00 (Kalshi pays $1/contract — the cash that landed
    // on settlement, before netting out cost). On a loss it's -cost_usd
    // (the money that disappeared). For losers this is equivalent to P&L,
    // but kept here so the column is non-zero on every settled row.
    let totalWL = null;
    if (t.state === "won" && t.cost_usd != null && t.pnl_usd != null) {
      totalWL = t.cost_usd + t.pnl_usd;        // = qty × $1
    } else if (t.state === "lost" && t.cost_usd != null) {
      totalWL = -t.cost_usd;
    }
    const totalWLCell = totalWL !== null
      ? `<td class="numeric mono ${pnlClass(totalWL)}">${fmtUSD(totalWL, true)}</td>`
      : '<td class="muted">—</td>';
    const sideCls = t.side === "yes" ? "pos" : "neg";
    return `<tr>
      <td class="muted" style="font-size: 11px;">${escapeHtml((t.ts || "").split("T")[0])}</td>
      <td class="mono">${escapeHtml(t.ticker)}</td>
      <td class="${sideCls}">${escapeHtml(String(t.side || "").toUpperCase())} @${t.price_cents}¢</td>
      <td class="numeric">${t.n_contracts}</td>
      ${pnlCell}
      ${totalWLCell}
      <td><span class="pill ${stateClass}">${escapeHtml(t.state || "")}</span></td>
    </tr>`;
  }).join("");
  return `
    <div class="card" style="grid-column: span 2;">
      <div class="card-title">Closed trades (${trades.length})</div>
      <div class="scrollable">
        <table>
          <thead><tr><th>Date</th><th>Ticker</th><th>Side</th><th class="numeric">Qty</th><th class="numeric">P&amp;L</th><th class="numeric">W/L</th><th>Result</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}
